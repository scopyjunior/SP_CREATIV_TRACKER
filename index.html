<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Fixed iOS Viewport: added viewport-fit=cover to avoid Safe Area layout calculation loops -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SP CREATIV">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="theme-color" content="#030712">
    <title>SP CREATIV | Secure Cloud & Payroll</title>
    
    <script>
        // Non-blocking Service Worker registration: wrapped in a try/catch so it can never crash iOS WebKit
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                try {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                        .catch(err => console.warn('Service Worker registration skipped/failed:', err));
                } catch (e) {
                    console.warn('SW registration failed silently:', e);
                }
            });
        }
    </script>
    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#030712',
                            900: '#0f172a',
                            800: '#1e293b',
                            750: '#1e293b90',
                            700: '#334155',
                            600: '#475569',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                        },
                        brand: {
                            indigo: '#6366f1',
                            violet: '#8b5cf6',
                            emerald: '#10b981',
                            rose: '#f43f5e',
                            amber: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none !important; }
        
        /* iOS-Specific Height Fix: forces Safari to respect screen boundaries without hiding key elements */
        html, body {
            height: 100%;
            height: -webkit-fill-available;
        }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
            background-color: #030712;
            -webkit-user-select: none;
            user-select: none;
        }
        .active-nav { 
            color: #8b5cf6; 
            text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar { 
            width: 5px; 
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #334155; 
            border-radius: 10px; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
            background: #475569; 
        }
        .safe-bottom { 
            padding-bottom: env(safe-area-inset-bottom, 24px); 
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .glass-input {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
        .glass-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-toast {
            animation: fadeInDown 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-100 font-sans select-none antialiased min-h-screen relative overflow-x-hidden">
    
    <!-- ambient background blobs -->
    <div class="fixed inset-0 bg-slate-950 -z-50 overflow-hidden">
        <div class="absolute top-[-10%] left-[-15%] w-[60%] h-[60%] rounded-full bg-brand-indigo/10 blur-[130px] pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-15%] w-[60%] h-[60%] rounded-full bg-brand-violet/10 blur-[130px] pointer-events-none"></div>
    </div>

    <div id="app" v-cloak class="flex flex-col min-h-screen">

        <!-- FLOATING TOAST NOTIFICATION -->
        <div v-if="toastMessage" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gradient-to-r from-brand-indigo to-brand-violet text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-black uppercase tracking-wider border border-white/20 animate-toast flex items-center gap-2">
            <span>{{ toastMessage }}</span>
        </div>
        
        <!-- LOGIN SCREEN -->
        <div v-if="!user" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-12 -right-12 w-28 h-28 bg-brand-indigo/20 rounded-full blur-2xl"></div>
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 shadow-lg overflow-hidden border border-slate-700/50">
                        <img src="./icon-192.png" alt="SP CREATIV Logo" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo via-violet-400 to-brand-violet italic uppercase tracking-wider">SP CREATIV</h1>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Secure Cloud Portal</p>
                </div>
                <div class="space-y-4">
                    <div class="relative">
                        <input v-model="authForm.email" type="email" placeholder="Email" class="w-full glass-input p-4 pl-5 rounded-2xl font-semibold outline-none text-sm text-slate-100 transition-all">
                    </div>
                    <div class="relative">
                        <input v-model="authForm.pass" type="password" placeholder="Password" class="w-full glass-input p-4 pl-5 rounded-2xl font-semibold outline-none text-sm text-slate-100 transition-all">
                    </div>
                    <button @click="handleLogin" class="w-full bg-gradient-to-r from-brand-indigo to-brand-violet hover:from-brand-indigo/90 hover:to-brand-violet/90 text-white font-black py-4 rounded-2xl shadow-lg shadow-brand-indigo/20 active:scale-95 transition-all text-sm tracking-widest uppercase">
                        {{ authLoading ? 'VERIFYING...' : 'LOGIN' }}
                    </button>
                    <p v-if="authError" class="text-brand-rose text-[10px] font-bold text-center uppercase mt-2 tracking-wide">{{ authError }}</p>
                </div>
            </div>
        </div>

        <!-- APP CONTENT -->
        <template v-if="user">
            <!-- Header -->
            <header class="bg-slate-900/40 backdrop-blur-md border-b border-slate-800/60 px-6 py-4 pt-10 sticky top-0 z-30 flex justify-between items-center shadow-md">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl overflow-hidden border border-slate-750 flex items-center justify-center shadow-md">
                        <img src="./icon-192.png" alt="SP CREATIV Logo" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 class="text-md font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo to-brand-violet italic uppercase leading-none">SP CREATIV</h1>
                        <p class="text-[8px] font-extrabold uppercase mt-1 tracking-wider" :class="isAdmin ? 'text-brand-indigo' : 'text-brand-emerald'">
                            {{ isAdmin ? 'Administrator' : 'Crew Mode' }} • {{ (user.email || '').split('@')[0] }}
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div v-if="loading" class="animate-spin h-3.5 w-3.5 border-2 border-brand-indigo border-t-transparent rounded-full"></div>
                    <button @click="handleLogout" class="text-[9px] font-black bg-slate-800/80 hover:bg-slate-755 border border-slate-700/50 px-3.5 py-1.5 rounded-full uppercase active:scale-90 transition-all tracking-wider text-slate-300">Logout</button>
                </div>
            </header>

            <main class="flex-1 p-4 pb-32 max-w-lg mx-auto w-full">
                
                <!-- LOADING SKELETON -->
                <div v-if="loading && sites.length === 0" class="space-y-4 animate-pulse">
                    <div class="glass-panel h-48 rounded-[2.5rem] p-6 space-y-4">
                        <div class="h-4 bg-slate-800 rounded-md w-1/3"></div>
                        <div class="h-12 bg-slate-800 rounded-xl"></div>
                        <div class="h-12 bg-slate-800 rounded-xl"></div>
                    </div>
                    <div class="glass-panel h-64 rounded-[2.5rem] p-6 space-y-4">
                        <div class="h-4 bg-slate-800 rounded-md w-1/2"></div>
                        <div class="h-8 bg-slate-800 rounded-lg" v-for="i in 3" :key="i"></div>
                    </div>
                </div>

                <template v-else>
                    <!-- ========================================== -->
                    <!--               ADMIN VIEWS                  -->
                    <!-- ========================================== -->
                    <template v-if="isAdmin">
                        
                        <!-- ADMIN VIEW: LOG LABOR -->
                        <div v-if="view === 'log'" class="space-y-4">
                            <div class="glass-panel p-6 rounded-[2.5rem] shadow-xl relative overflow-hidden">
                                <div class="absolute -top-10 -left-10 w-24 h-24 bg-brand-indigo/5 rounded-full blur-2xl pointer-events-none"></div>
                                <h3 class="text-xs font-black uppercase text-slate-400 mb-5 tracking-widest">Log Labor</h3>
                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    <div class="space-y-1.5">
                                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Date</label>
                                        <input type="date" v-model="form.date" class="w-full glass-input rounded-2xl p-4 border-0 text-xs font-bold outline-none text-white transition-all">
                                    </div>
                                    <div class="space-y-1.5">
                                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Hours to Add</label>
                                        <input type="number" step="0.5" min="0" v-model="form.hours" class="w-full glass-input rounded-2xl p-4 border-0 text-xs font-bold outline-none text-white transition-all">
                                    </div>
                                </div>
                                
                                <div class="space-y-1.5 mb-5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Project Site</label>
                                    <div class="relative">
                                        <select v-model="form.siteId" class="w-full glass-input rounded-2xl p-4 border-0 font-bold text-xs outline-none appearance-none text-white transition-all">
                                            <option value="" disabled class="bg-slate-900 text-slate-400">Select Site...</option>
                                            <option v-for="s in activeSites" :key="s.id" :value="s.id" class="bg-slate-900 text-slate-100">{{s.name}}</option>
                                        </select>
                                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-2">
                                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Select Crew</label>
                                    <div class="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                                        <button v-for="e in activeEmployees" :key="e.id" @click="toggleEmp(e.id)" 
                                             :class="form.selected.includes(e.id) ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow-lg shadow-brand-indigo/10 border-transparent' : 'bg-slate-900/30 text-slate-400 border-slate-800/80'"
                                             class="p-4 rounded-2xl font-bold text-left flex justify-between items-center transition-all border hover:border-slate-700/80">
                                            <div class="flex flex-col">
                                                <span class="text-xs" :class="form.selected.includes(e.id) ? 'text-white' : 'text-slate-200'">{{e.name}}</span>
                                                <span class="text-[8px] uppercase tracking-wide mt-0.5" :class="form.selected.includes(e.id) ? 'text-indigo-200' : 'text-slate-400'">
                                                    Daily total: {{ getTodayHours(e.id) }}h
                                                </span>
                                            </div>
                                            <span v-if="form.selected.includes(e.id)" class="bg-white/20 w-5 h-5 rounded-full flex items-center justify-center text-xs">✓</span>
                                        </button>
                                    </div>
                                </div>

                                <!-- STRICT ZERO-HOUR PREVENTION -->
                                <button @click="saveLabor" :disabled="!form.siteId || !form.selected.length || !form.hours || form.hours <= 0 || loading"
                                        class="w-full bg-gradient-to-r from-brand-indigo to-brand-violet disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 text-white font-black py-4 rounded-2xl mt-8 shadow-xl shadow-brand-indigo/10 active:scale-95 transition-all text-xs tracking-wider">
                                    {{ loading ? 'SYNCING...' : 'SYNC ENTRIES (' + form.selected.length + ')' }}
                                </button>
                            </div>
                        </div>

                        <!-- =========================================================================
                             ADMIN VIEW: DECONT & MINUSURI (NOUL MODUL FINANCIAR DEDICAT)
                             ========================================================================= -->
                        <div v-if="view === 'settlement'" class="space-y-4">
                            
                            <!-- Sub-tabs: Calculator Decont vs. Arhivă Deconturi -->
                            <div class="flex p-1 bg-slate-900/80 border border-slate-800/80 rounded-2xl shadow-lg items-center">
                                <button @click="settleSubTab = 'calc'" :class="settleSubTab === 'calc' ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow' : 'text-slate-400'" class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">
                                    💰 Calculator & Minusuri
                                </button>
                                <button @click="settleSubTab = 'archive'" :class="settleSubTab === 'archive' ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow' : 'text-slate-400'" class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">
                                    📚 Istoric Salvat ({{ settlements.length }})
                                </button>
                            </div>

                            <!-- 1. FORMULAR CALCULATOR DECONT -->
                            <div v-if="settleSubTab === 'calc'" class="glass-panel p-6 rounded-[2.5rem] shadow-xl relative overflow-hidden space-y-5">
                                <div class="absolute -top-12 -right-12 w-28 h-28 bg-brand-indigo/15 rounded-full blur-2xl pointer-events-none"></div>
                                
                                <div class="flex justify-between items-center border-b border-slate-800/60 pb-3">
                                    <div>
                                        <h3 class="text-xs font-black uppercase text-slate-300 tracking-widest">Decont Salariu & Minusuri</h3>
                                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mt-0.5">Ore × Tarif − Scăderi = Rest de Dat</p>
                                    </div>
                                    <input type="month" v-model="settleForm.month" class="glass-input rounded-xl px-3 py-1.5 text-xs font-black text-brand-indigo outline-none">
                                </div>

                                <!-- Pas 1: Selectare Muncitor -->
                                <div class="space-y-1.5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">1. Selectează Muncitorul</label>
                                    <div class="relative">
                                        <select v-model="settleForm.eid" @change="onSettleEmpChange" class="w-full glass-input rounded-2xl p-4 border-0 font-bold text-xs outline-none appearance-none text-white transition-all">
                                            <option value="" disabled class="bg-slate-900 text-slate-400">Selectează Muncitor...</option>
                                            <option v-for="e in activeEmployees" :key="e.id" :value="e.id" class="bg-slate-900 text-slate-100">
                                                {{e.name}} (Tarif: €{{e.rate || 0}}/h)
                                            </option>
                                        </select>
                                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                                        </div>
                                    </div>
                                </div>

                                <!-- Pas 2: Ore Lucrate & Tarif -->
                                <div class="space-y-1.5">
                                    <div class="flex justify-between items-center">
                                        <label class="text-[9px] font-black text-brand-indigo uppercase tracking-widest">2. Ore & Tarif Orar</label>
                                        <button v-if="settleAutoHours > 0" @click="settleForm.hours = settleAutoHours" class="text-[8.5px] bg-brand-indigo/10 border border-brand-indigo/30 text-brand-indigo px-2 py-0.5 rounded-lg font-bold hover:bg-brand-indigo/20 transition-all">
                                            📥 Încarcă {{ settleAutoHours }}h din Pontaj
                                        </button>
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div class="glass-input p-3.5 rounded-2xl">
                                            <span class="text-[8px] font-black text-slate-400 uppercase block mb-1">Ore Lucrate</span>
                                            <input type="number" step="0.5" min="0" v-model.number="settleForm.hours" placeholder="ex: 160" class="w-full bg-transparent text-xl font-black text-white outline-none">
                                        </div>
                                        <div class="glass-input p-3.5 rounded-2xl">
                                            <span class="text-[8px] font-black text-slate-400 uppercase block mb-1">Tarif Orar (€/h)</span>
                                            <input type="number" step="1" min="0" v-model.number="settleForm.rate" placeholder="ex: 35" class="w-full bg-transparent text-xl font-black text-brand-indigo outline-none">
                                        </div>
                                    </div>
                                    <div class="flex justify-between items-center p-2.5 bg-slate-900/50 rounded-xl border border-slate-800/60 text-[10px]">
                                        <span class="text-slate-400 font-bold">Venit Brut ({{ settleForm.hours || 0 }}h × €{{ settleForm.rate || 0 }}):</span>
                                        <span class="font-black text-brand-indigo">€{{ settleGross.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) }}</span>
                                    </div>
                                </div>

                                <!-- Pas 3: Scăderi / Minusuri -->
                                <div class="space-y-3 pt-2 border-t border-slate-800/60">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <label class="text-[9px] font-black text-brand-rose uppercase tracking-widest block">3. Scăderi & Minusuri</label>
                                            <span class="text-[8px] text-slate-500">Motorină, bonuri de masă, scule, avans</span>
                                        </div>
                                        <span class="text-[10px] font-black text-brand-rose bg-brand-rose/10 px-2.5 py-1 rounded-xl border border-brand-rose/20">
                                            -€{{ settleTotalDeductions.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) }}
                                        </span>
                                    </div>

                                    <!-- Butoane rapide de adăugare -->
                                    <div class="flex flex-wrap gap-1.5">
                                        <button v-for="preset in deductionPresets" :key="preset.label" @click="addSettleDeduction(preset.reason)"
                                                class="text-[8.5px] bg-slate-900/60 hover:bg-slate-800 border border-slate-800 px-2.5 py-1 rounded-xl font-bold text-slate-300 transition-all active:scale-95">
                                            + {{ preset.label }}
                                        </button>
                                    </div>

                                    <!-- Lista de scăderi -->
                                    <div class="space-y-2 max-h-52 overflow-y-auto pr-1 custom-scrollbar">
                                        <div v-for="(item, idx) in settleForm.deductions" :key="item.id" class="flex items-center gap-2 bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800/80">
                                            <span class="text-[9px] text-slate-600 font-black px-1">{{ idx + 1 }}.</span>
                                            <input v-model="item.reason" placeholder="Motiv (ex: Motorină dubă)" class="flex-1 bg-transparent text-xs text-slate-200 outline-none font-bold">
                                            <div class="flex items-center gap-1 bg-slate-900 px-2.5 py-1 rounded-xl border border-brand-rose/30">
                                                <span class="text-xs text-brand-rose font-black">-€</span>
                                                <input v-model.number="item.amount" type="number" step="0.5" placeholder="0" class="w-16 bg-transparent text-xs font-black text-brand-rose text-right outline-none">
                                            </div>
                                            <button @click="removeSettleDeduction(item.id)" class="text-slate-500 hover:text-brand-rose p-1 text-xs">✕</button>
                                        </div>
                                    </div>

                                    <button @click="addSettleDeduction('')" class="w-full py-2 bg-slate-900/40 hover:bg-slate-900 border border-dashed border-slate-800 rounded-xl text-[9px] font-bold uppercase tracking-wider text-slate-400 transition-all">
                                        + Adaugă alt motiv de scădere
                                    </button>
                                </div>

                                <!-- CARD MARE REZULTAT: REST DE PLATĂ -->
                                <div class="bg-gradient-to-br from-brand-emerald/20 via-slate-900/80 to-slate-950 p-5 rounded-3xl border border-brand-emerald/40 space-y-4">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <span class="text-[8px] font-black uppercase text-brand-emerald tracking-widest block">REST DE PLATĂ (LICHIDARE)</span>
                                            <p class="text-2xl font-black text-brand-emerald mt-0.5">
                                                €{{ settleNet.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) }}
                                            </p>
                                        </div>
                                        <span class="text-[8.5px] bg-slate-950/80 text-slate-300 font-mono font-bold px-2.5 py-1 rounded-xl border border-slate-800">
                                            {{ formatMonth(settleForm.month) }}
                                        </span>
                                    </div>

                                    <div class="grid grid-cols-2 gap-2 pt-2">
                                        <button @click="saveSettlementToCloud" :disabled="!settleForm.eid || settleForm.hours <= 0 || loading"
                                                class="bg-gradient-to-r from-brand-indigo to-brand-violet disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 text-white font-black py-3.5 rounded-2xl text-[10px] uppercase tracking-wider shadow-lg active:scale-95 transition-all flex items-center justify-center gap-1.5">
                                            <span>💾</span> {{ loading ? 'SAVING...' : 'SALVEAZĂ' }}
                                        </button>
                                        <button @click="copyWhatsAppSettlement"
                                                class="bg-brand-emerald/20 hover:bg-brand-emerald/30 border border-brand-emerald/40 text-brand-emerald font-black py-3.5 rounded-2xl text-[10px] uppercase tracking-wider active:scale-95 transition-all flex items-center justify-center gap-1.5">
                                            <span>📋</span> WHATSAPP
                                        </button>
                                    </div>
                                </div>

                            </div>

                            <!-- 2. ARHIVĂ DECONTURI SALVATE -->
                            <div v-if="settleSubTab === 'archive'" class="space-y-3">
                                <div class="flex justify-between items-center px-1">
                                    <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest">Arhivă Deconturi</h3>
                                    <span class="text-[9px] font-bold text-brand-indigo bg-brand-indigo/10 px-2.5 py-0.5 rounded-full">{{ settlements.length }} Salvate</span>

                // Milestone Helper - total contract value of the site
                const calculateSiteTotal = (sid) => {
                    return (sites.value.find(x => x.id === sid)?.pricingItems || []).reduce((a, b) => {
                        return a + ((parseFloat(b.qty)||0) * (parseFloat(b.price)||0));
                    }, 0);
                };

                const calculateSitePaid = (sid) => {
                    const s = sites.value.find(x => x.id === sid);
                    if (!s) return 0;
                    if (s.isPaid) return calculateSiteTotal(sid);
                    return (s.pricingItems || []).reduce((a, b) => {
                        const pct = parseFloat(b.paidPercent) || 0;
                        const value = (parseFloat(b.qty)||0) * (parseFloat(b.price)||0);
                        return a + (value * (pct / 100));
                    }, 0);
                };

                const calculateSiteOwed = (sid) => {
                    const s = sites.value.find(x => x.id === sid);

                        const pct = parseFloat(b.paidPercent) || 0;
                        const value = (parseFloat(b.qty)||0) * (parseFloat(b.price)||0);
                        return a + (value * (1 - (pct / 100)));
                    }, 0);

                    if (!dateStr) return false;
                    
                    const parts = dateStr.split('T')[0].split('-');
                    if (parts.length !== 3) return false;
                    
                    const [y, m, d] = parts.map(Number);
                    const logD = new Date(y, m - 1, d, 12, 0, 0); 
                    
                    const now = new Date();
                    now.setHours(12, 0, 0, 0);
                    
                    if (statTimeframe.value === 'Month') {
                        const targetMonth = new Date(now.getFullYear(), now.getMonth() + timeOffset.value, 1, 12, 0, 0);
                        return logD.getFullYear() === targetMonth.getFullYear() && logD.getMonth() === targetMonth.getMonth();
                    }
                    
                    if (statTimeframe.value === 'Week') {
                        const dayOfWeek = now.getDay();
                        const daysToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                        
                        const targetMonday = new Date(now);
                        targetMonday.setDate(now.getDate() + daysToMonday + (timeOffset.value * 7));
                        targetMonday.setHours(0, 0, 0, 0);
                        
                        const targetSunday = new Date(targetMonday);
                        targetSunday.setDate(targetMonday.getDate() + 6);
                        targetSunday.setHours(23, 59, 59, 999);
                        
                        return logD.getTime() >= targetMonday.getTime() && logD.getTime() <= targetSunday.getTime();

                    return true;

                    const existing = payrollStatus.value.find(p => p.id === monthStr);
                    const isPaid = existing ? !existing.isPaid : true;
                    await fsSetDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'payroll_status', monthStr), { isPaid });
                };

                const sortedSites = computed(() => {
                    return [...sites.value].sort((a, b) => {
                        const logsA = logs.value.filter(l => l.sid === a.id);
                        const maxTA = logsA.length > 0 ? Math.max(...logsA.map(l => {
                            const d = new Date(l.date).getTime();
                            return isNaN(d) ? 0 : d;
                        })) : 0;
                        const tA = maxTA || (a.createdAt !== undefined ? a.createdAt : 0);

                        const logsB = logs.value.filter(l => l.sid === b.id);
                        const maxTB = logsB.length > 0 ? Math.max(...logsB.map(l => {
                            const d = new Date(l.date).getTime();
                            return isNaN(d) ? 0 : d;
                        })) : 0;
                        const tB = maxTB || (b.createdAt !== undefined ? b.createdAt : 0);

                        return tB - tA;
                    });
                });

                return { 
                    user, authForm, authLoading, authError, handleLogin, handleLogout, view, sites, employees, logs, form, news, priceForm, loading, toastMessage,
                    statTimeframe, timeOffset, currentTimeLabel, isAdmin, empEmails, empRates, selectedMonth, formatMonth,
                    activeSites, activeEmployees, historyFilters, deletingLogId, deletingSiteId, deletingEmpId,
                    toggleEmp, saveLabor, deleteLog, addItemToSite, removeItemFromSite, togglePaid, addSite, addEmp, linkEmpEmail, unlinkEmpEmail, archiveSite, archiveEmp, updateEmpRate, updateItemPaymentPercent,
                    calculateSiteTotal, calculateSitePaid, calculateSiteOwed, getSiteHours, getSiteHoursPercentage, getTodayHours,
                    getAllTimeSiteHours, calculateSiteYield,
                    mySiteHours, myTotalHours, mySortedLogs,
                    getEmpName, getSiteName,
                    payrollStatus, getSelectedMonthStr, isSelectedMonthPaid, togglePayrollPaid, sortedSites,
                    
                    // Modul Decont Returnat
                    settleSubTab, settleForm, deductionPresets, settleAutoHours, settleGross, settleTotalDeductions, settleNet,
                    addSettleDeduction, removeSettleDeduction, saveSettlementToCloud, deleteSettlement, copyWhatsAppSettlement,
                    copySpecificSettlement, onSettleEmpChange, settlements, sortedSettlements, myLatestSettlement,

                    statsEmpHours: computed(() => {
                        const res = {};
                        logs.value.filter(l => isDateInTimeframe(l.date)).forEach(l => {
                            const emp = employees.value.find(e => e.id === l.eid);
                            const n = emp?.name || 'Worker';
                            if(!res[n]) res[n] = { hours: 0, rate: emp?.rate || 0 };
                            res[n].hours += (parseFloat(l.h) || 0);
                        });
                        return res;
                    }),

                    dailyBreakdown: computed(() => {
                        const days = {};
                        logs.value.filter(l => isDateInTimeframe(l.date)).forEach(l => {
                            if (!days[l.date]) days[l.date] = 0;
                            days[l.date] += (parseFloat(l.h) || 0);
                        });
                        return Object.keys(days)
                            .sort((a,b) => new Date(b) - new Date(a)) 
                            .map(date => ({
                                date,
                                displayDate: formatDisplayDateSafe(date),
                                hours: days[date]
                            }));
                    }),

                    weeklyTrack: computed(() => {
                        const days = getWeekDates();
                        const relevantLogs = logs.value.filter(l => {
                            if (!isAdmin.value && currentUserEmployee.value) {
                                return l.eid === currentUserEmployee.value.id;
                            }
                            return true;
                        });

                        return days.map(d => {
                            const dayLogs = relevantLogs.filter(l => l.date === d.dateStr);
                            const hrs = dayLogs.reduce((sum, l) => sum + (parseFloat(l.h) || 0), 0);
                            return {
                                ...d,
                                hours: hrs,
                                worked: hrs > 0
                            };
                        });
                    }),

                    weekdayDistribution: computed(() => {
                        const relevantLogs = logs.value.filter(l => {
                            if (!isDateInTimeframe(l.date)) return false;
                            if (!isAdmin.value && currentUserEmployee.value) {
                                return l.eid === currentUserEmployee.value.id;
                            }
                            return true;
                        });

                        const counts = { Mon: 0, Tue: 0, Wed: 0, Thu: 0, Fri: 0, Sat: 0, Sun: 0 };
                        relevantLogs.forEach(l => {
                            const parts = l.date.split('-');
                            if (parts.length === 3) {
                                const date = new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0);
                                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                                if (counts[dayName] !== undefined) {
                                    counts[dayName] += (parseFloat(l.h) || 0);
                                }
                            }
                        });

                        const maxHours = Math.max(...Object.values(counts), 1);

                        return Object.keys(counts).map(day => ({
                            day,
                            hours: counts[day],
                            percentage: Math.round((counts[day] / maxHours) * 100)
                        }));
                    }),
                    
                    statsRevenue: computed(() => {
                        let paid = 0, unpaid = 0, laborCost = 0;
                        
                        sites.value.forEach(s => {
                            const sitePaid = calculateSitePaid(s.id);
                            const siteOwed = calculateSiteOwed(s.id);
                            const hasLogs = logs.value.some(l => l.sid === s.id && isDateInTimeframe(l.date));
                            if(hasLogs || statTimeframe.value === 'All') {
                                paid += sitePaid;
                                unpaid += siteOwed;
                            }
                        });

                        logs.value.filter(l => isDateInTimeframe(l.date)).forEach(l => {
                            const emp = employees.value.find(e => e.id === l.eid);
                            laborCost += ((parseFloat(l.h) || 0) * (parseFloat(emp?.rate) || 0));
                        });

                        return { paid, unpaid, laborCost, profit: (paid + unpaid) - laborCost };
                    }),

                    filteredLogs: computed(() => {
                        return logs.value
                            .filter(l => {
                                const matchEmp = !historyFilters.eid || l.eid === historyFilters.eid;
                                const matchSite = !historyFilters.sid || l.sid === historyFilters.sid;
                                return matchEmp && matchSite;
                            })
                            .sort((a,b) => new Date(b.date) - new Date(a.date));
                    })
                };
            }
        }).mount('#app');
    </script>
</body>
