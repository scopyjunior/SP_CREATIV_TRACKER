
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <!-- Fixed iOS Viewport: added viewport-fit=cover to avoid Safe Area layout calculation loops -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SP CREATIV">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="theme-color" content="#030712">
    <title>SP CREATIV | Portal Cloud & Pontaj Șantiere</title>
    
    <script>
        // Non-blocking Service Worker registration: wrapped in a try/catch so it can never crash iOS WebKit
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                try {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('Service Worker înregistrat cu succes:', reg.scope))
                        .catch(err => console.warn('Înregistrare Service Worker eșuată:', err));
                } catch (e) {
                    console.warn('Eroare silențioasă la înregistrarea SW:', e);
                }
            });
        }
    </script>
    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#030712',
                            900: '#0f172a',
                            800: '#1e293b',
                            750: '#1e293b90',
                            700: '#334155',
                            600: '#475569',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                        },
                        brand: {
                            indigo: '#6366f1',
                            violet: '#8b5cf6',
                            emerald: '#10b981',
                            rose: '#f43f5e',
                            amber: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none !important; }
        
        /* iOS-Specific Height Fix: forces Safari to respect screen boundaries without hiding key elements */
        html, body {
            height: 100%;
            height: -webkit-fill-available;
        }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
            background-color: #030712;
            -webkit-user-select: none;
            user-select: none;
        }
        .active-nav { 
            color: #8b5cf6; 
            text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar { 
            width: 5px; 
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track { 
            background: rgba(15, 23, 42, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #334155; 
            border-radius: 10px; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
            background: #475569; 
        }
        .safe-bottom { 
            padding-bottom: env(safe-area-inset-bottom, 24px); 
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .glass-input {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
        .glass-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-toast {
            animation: fadeInDown 0.3s ease-out forwards;
        }
        @keyframes fleetPulseRose {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.35); border-color: rgba(244, 63, 94, 0.65); }
            50% { box-shadow: 0 0 18px 2px rgba(244, 63, 94, 0.25); border-color: rgba(244, 63, 94, 0.95); }
        }
        .fleet-expired-pulse {
            animation: fleetPulseRose 1.8s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-slate-100 font-sans select-none antialiased min-h-screen relative overflow-x-hidden">
    
    <!-- Fundal ambiental -->
    <div class="fixed inset-0 bg-slate-950 -z-50 overflow-hidden">
        <div class="absolute top-[-10%] left-[-15%] w-[60%] h-[60%] rounded-full bg-brand-indigo/10 blur-[130px] pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-15%] w-[60%] h-[60%] rounded-full bg-brand-violet/10 blur-[130px] pointer-events-none"></div>
    </div>

    <div id="app" v-cloak class="flex flex-col min-h-screen">

        <!-- NOTIFICARE TOAST PLUTITOARE -->
        <div v-if="toastMessage" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gradient-to-r from-brand-indigo to-brand-violet text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-black uppercase tracking-wider border border-white/20 animate-toast flex items-center gap-2">
            <span>{{ toastMessage }}</span>
        </div>
        
        <!-- ECRAN DE CONECTARE -->
        <div v-if="!user" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-12 -right-12 w-28 h-28 bg-brand-indigo/20 rounded-full blur-2xl"></div>
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 shadow-lg overflow-hidden border border-slate-700/50">
                        <img src="./icon-192.png" alt="Siglă SP CREATIV" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo via-violet-400 to-brand-violet italic uppercase tracking-wider">SP CREATIV</h1>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Portal Cloud Securizat</p>
                </div>
                <div class="space-y-4">
                    <div class="relative">
                        <input v-model="authForm.email" type="email" placeholder="Adresă Email" class="w-full glass-input p-4 pl-5 rounded-2xl font-semibold outline-none text-sm text-slate-100 transition-all">
                    </div>
                    <div class="relative">
                        <input v-model="authForm.pass" type="password" placeholder="Parolă" class="w-full glass-input p-4 pl-5 rounded-2xl font-semibold outline-none text-sm text-slate-100 transition-all">
                    </div>
                    <button @click="handleLogin" class="w-full bg-gradient-to-r from-brand-indigo to-brand-violet hover:from-brand-indigo/90 hover:to-brand-violet/90 text-white font-black py-4 rounded-2xl shadow-lg shadow-brand-indigo/20 active:scale-95 transition-all text-sm tracking-widest uppercase">
                        {{ authLoading ? 'SE VERIFICĂ...' : 'AUTENTIFICARE' }}
                    </button>
                    <p v-if="authError" class="text-brand-rose text-[10px] font-bold text-center uppercase mt-2 tracking-wide">{{ authError }}</p>
                </div>
            </div>
        </div>

        <!-- CONȚINUT APLICAȚIE -->
        <template v-if="user">
            <!-- Antet (Header) -->
            <header class="bg-slate-900/40 backdrop-blur-md border-b border-slate-800/60 px-6 py-4 pt-10 sticky top-0 z-30 flex justify-between items-center shadow-md">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl overflow-hidden border border-slate-750 flex items-center justify-center shadow-md">
                        <img src="./icon-192.png" alt="Siglă SP CREATIV" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 class="text-md font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo to-brand-violet italic uppercase leading-none">SP CREATIV</h1>
                        <p class="text-[8px] font-extrabold uppercase mt-1 tracking-wider" :class="isAdmin ? 'text-brand-indigo' : 'text-brand-emerald'">
                            {{ isAdmin ? 'Administrator' : 'Mod Muncitor' }} • {{ (user.email || '').split('@')[0] }}
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2.5">
                    <div v-if="loading" class="animate-spin h-3.5 w-3.5 border-2 border-brand-indigo border-t-transparent rounded-full"></div>
                    <!-- Clopoțel Alerte Flotă & Documente (Doar Admin) -->
                    <button v-if="isAdmin" @click="view = 'fleet'"
                            :class="view === 'fleet' ? 'bg-brand-indigo/25 border-brand-indigo/60 text-white' : 'bg-slate-800/80 border-slate-700/50 text-slate-200 hover:bg-slate-700/80'"
                            class="relative p-2 rounded-xl border text-xs active:scale-90 transition-all"
                            title="Alerte Flotă & Documente">
                        <span>🔔</span>
                        <span v-if="fleetUrgentCount > 0"
                              class="absolute -top-1.5 -right-1.5 min-w-[1.1rem] h-[1.1rem] px-1 bg-brand-rose text-white text-[8px] font-black rounded-full flex items-center justify-center shadow-lg shadow-brand-rose/40 animate-pulse">
                            {{ fleetUrgentCount }}
                        </span>
                    </button>
                    <button @click="handleLogout" class="text-[9px] font-black bg-slate-800/80 hover:bg-slate-755 border border-slate-700/50 px-3.5 py-1.5 rounded-full uppercase active:scale-90 transition-all tracking-wider text-slate-300">Deconectare</button>
                </div>
            </header>

            <!-- BANNER URGENT ALERTE FLOTĂ & DOCUMENTE (< 30 ZILE SAU EXPIRATE) -->
            <div v-if="isAdmin && fleetUrgentCount > 0 && view !== 'fleet'"
                 @click="view = 'fleet'"
                 :class="fleetUrgentItems[0].daysLeft <= 0 ? 'fleet-expired-pulse bg-gradient-to-r from-brand-rose/30 via-rose-950/90 to-brand-rose/30 border-brand-rose/70' : 'bg-gradient-to-r from-brand-rose/20 via-slate-900/95 to-brand-rose/20 border-brand-rose/40'"
                 class="border-b px-4 py-2.5 cursor-pointer hover:brightness-110 transition-all sticky top-[76px] z-20">
                <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="text-sm shrink-0">⚠️</span>
                        <div class="min-w-0">
                            <p class="text-[9.5px] font-black uppercase text-rose-200 truncate tracking-wide">
                                {{ formatFleetBannerAlert(fleetUrgentItems[0]) }}
                            </p>
                            <p v-if="fleetUrgentCount > 1" class="text-[8px] font-bold text-rose-300/80 uppercase tracking-wider">
                                + încă {{ fleetUrgentCount - 1 }} {{ fleetUrgentCount - 1 === 1 ? 'alertă activă' : 'alerte active' }}
                            </p>
                        </div>
                    </div>
                    <span class="text-[8px] font-black uppercase bg-brand-rose text-white px-2.5 py-1 rounded-lg shrink-0 tracking-wider shadow">
                        Vezi Flota
                    </span>
                </div>
            </div>

            <main class="flex-1 p-4 pb-32 max-w-lg mx-auto w-full">
                
                <!-- SCHELET DE ÎNCĂRCARE (LOADING SKELETON) -->
                <div v-if="loading && sites.length === 0" class="space-y-4 animate-pulse">
                    <div class="glass-panel h-48 rounded-[2.5rem] p-6 space-y-4">
                        <div class="h-4 bg-slate-800 rounded-md w-1/3"></div>
                        <div class="h-12 bg-slate-800 rounded-xl"></div>
                        <div class="h-12 bg-slate-800 rounded-xl"></div>
                    </div>
                    <div class="glass-panel h-64 rounded-[2.5rem] p-6 space-y-4">
                        <div class="h-4 bg-slate-800 rounded-md w-1/2"></div>
                        <div class="h-8 bg-slate-800 rounded-lg" v-for="i in 3" :key="i"></div>
                    </div>
                </div>

                <template v-else>
                    <!-- ========================================== -->
                    <!--               SECȚIUNI ADMIN               -->
                    <!-- ========================================== -->
                    <template v-if="isAdmin">
                        
                        <!-- SECȚIUNE ADMIN: ÎNREGISTREAZĂ PONTAJ (CU CALENDAR VIZUAL COLORAT) -->
                        <div v-if="view === 'log'" class="space-y-4">
                            <div class="glass-panel p-6 rounded-[2.5rem] shadow-xl relative overflow-hidden">
                                <div class="absolute -top-10 -left-10 w-24 h-24 bg-brand-indigo/5 rounded-full blur-2xl pointer-events-none"></div>
                                <div class="flex justify-between items-center mb-5">
                                    <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest">Înregistrează Pontaj</h3>
                                    <button @click="showVisualCalendar = !showVisualCalendar" 
                                            class="text-[8.5px] font-black uppercase tracking-wider px-2.5 py-1 rounded-xl border border-brand-indigo/30 transition-all flex items-center gap-1"
                                            :class="showVisualCalendar ? 'bg-brand-indigo text-white' : 'bg-brand-indigo/10 text-brand-indigo hover:bg-brand-indigo/20'">
                                        <span>📅</span>
                                        <span>{{ showVisualCalendar ? 'Calendar Activ' : 'Afișează Calendar' }}</span>
                                    </button>
                                </div>

                                <!-- CALENDAR VIZUAL CU ZILE COLORATE PENTRU PONTAJE EXISTENTE -->
                                <div v-if="showVisualCalendar" class="mb-5 bg-slate-900/60 border border-slate-800/80 rounded-3xl p-4 space-y-3">
                                    <div class="flex justify-between items-center px-1">
                                        <button type="button" @click="prevCalMonth" class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-black text-slate-300 active:scale-95 transition-all">
                                            ◀
                                        </button>
                                        <div class="text-center">
                                            <span class="text-xs font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo to-brand-violet tracking-wider">
                                                {{ calMonthName }}
                                            </span>
                                        </div>
                                        <div class="flex items-center gap-1.5">
                                            <button type="button" @click="setCalToday" class="text-[8.5px] font-black uppercase px-2 py-1 rounded-lg bg-brand-indigo/15 text-brand-indigo border border-brand-indigo/30 active:scale-95 transition-all">
                                                Azi
                                            </button>
                                            <button type="button" @click="nextCalMonth" class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-black text-slate-300 active:scale-95 transition-all">
                                                ▶
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Antete Zile Săptămână (Luni - Duminică) -->
                                    <div class="grid grid-cols-7 gap-1 text-center">
                                        <span v-for="w in ['Lu', 'Ma', 'Mi', 'Jo', 'Vi', 'Sâ', 'Du']" :key="w" class="text-[8px] font-black uppercase text-slate-500 py-1">
                                            {{ w }}
                                        </span>
                                    </div>

                                    <!-- Grilă Zile Calendar -->
                                    <div class="grid grid-cols-7 gap-1 text-center">
                                        <button v-for="d in calendarDays" :key="d.dateStr" type="button"
                                                @click="selectCalDate(d.dateStr)"
                                                :class="[
                                                    !d.isCurrentMonth ? 'opacity-25' : '',
                                                    d.isSelected 
                                                        ? 'bg-gradient-to-br from-brand-indigo to-brand-violet text-white font-black shadow-lg shadow-brand-indigo/40 ring-2 ring-white/50 scale-105 z-10' 
                                                        : d.hasLogs 
                                                            ? 'bg-brand-emerald/20 text-brand-emerald border border-brand-emerald/40 font-black hover:bg-brand-emerald/30 shadow-[0_0_8px_rgba(16,185,129,0.15)]' 
                                                            : 'bg-slate-950/40 text-slate-300 border border-slate-800/50 hover:border-slate-700',
                                                    d.isToday && !d.isSelected ? 'ring-1 ring-brand-indigo' : ''
                                                ]"
                                                class="h-10 rounded-xl flex flex-col items-center justify-center relative transition-all active:scale-95">
                                            <span class="text-[10px] leading-none">{{ d.dayNum }}</span>
                                            <!-- Indicator ore pontate -->
                                            <span v-if="d.hasLogs" 
                                                  :class="d.isSelected ? 'text-indigo-100' : 'text-brand-emerald'"
                                                  class="text-[7px] font-black leading-tight mt-0.5">
                                                {{ d.totalHours }}h
                                            </span>
                                            <span v-else-if="d.isToday && !d.isSelected" class="w-1 h-1 bg-brand-indigo rounded-full mt-0.5"></span>
                                        </button>
                                    </div>

                                    <!-- Sumar și Legendă Calendar -->
                                    <div class="pt-2 border-t border-slate-800/80 flex justify-between items-center flex-wrap gap-2 text-[8px]">
                                        <div class="flex items-center gap-3">
                                            <div class="flex items-center gap-1 text-brand-emerald font-black">
                                                <span class="w-2 h-2 rounded-full bg-brand-emerald inline-block"></span>
                                                <span>Cu Pontaje</span>
                                            </div>
                                            <div class="flex items-center gap-1 text-brand-indigo font-black">
                                                <span class="w-2 h-2 rounded-full bg-brand-indigo inline-block"></span>
                                                <span>Data Selectată</span>
                                            </div>
                                        </div>
                                        <span class="text-slate-400 font-bold">
                                            {{ selectedDateLogSummary }}
                                        </span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    <div class="space-y-1.5">
                                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest flex items-center justify-between">
                                            <span>Data</span>
                                            <span v-if="selectedDayTotalHours > 0" class="text-brand-emerald text-[8px]">
                                                ● {{ selectedDayTotalHours }}h pontate azi
                                            </span>
                                        </label>
                                        <input type="date" v-model="form.date" class="w-full glass-input rounded-2xl p-4 border-0 text-xs font-bold outline-none text-white transition-all">
                                    </div>
                                    <div class="space-y-1.5">
                                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Ore de Pontat</label>
                                        <input type="number" step="0.5" min="0" v-model="form.hours" class="w-full glass-input rounded-2xl p-4 border-0 text-xs font-bold outline-none text-white transition-all">
                                    </div>
                                </div>
                                
                                <div class="space-y-1.5 mb-5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Șantier Proiect</label>
                                    <div class="relative">
                                        <select v-model="form.siteId" class="w-full glass-input rounded-2xl p-4 border-0 font-bold text-xs outline-none appearance-none text-white transition-all">
                                            <option value="" disabled class="bg-slate-900 text-slate-400">Selectează Șantierul...</option>
                                            <option v-for="s in activeSites" :key="s.id" :value="s.id" class="bg-slate-900 text-slate-100">{{s.name}}</option>
                                        </select>
                                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                                        </div>
                                    </div>
                                    <!-- Navigație Rapidă GPS pentru Șantierul Selectat -->
                                    <div v-if="selectedSiteObject && hasSiteLocation(selectedSiteObject)"
                                         class="flex items-center justify-between gap-2 bg-slate-950/60 border border-slate-800/80 rounded-2xl px-3 py-2 mt-2">
                                        <span class="text-[8.5px] font-bold text-slate-300 truncate">
                                            📍 {{ getSiteLocationSummary(selectedSiteObject) }}
                                        </span>
                                        <div class="flex items-center gap-1.5 shrink-0">
                                            <button type="button" @click="openInWaze(selectedSiteObject)"
                                                    class="px-2.5 py-1 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/35 text-[8px] font-black uppercase active:scale-95 transition-all">
                                                🚗 Waze
                                            </button>
                                            <button type="button" @click="openInMaps(selectedSiteObject)"
                                                    class="px-2.5 py-1 rounded-xl bg-brand-emerald/20 hover:bg-brand-emerald/30 text-brand-emerald border border-brand-emerald/35 text-[8px] font-black uppercase active:scale-95 transition-all">
                                                🗺️ Maps
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-2">
                                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Selectează Echipa</label>
                                    <div class="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                                        <button v-for="e in activeEmployees" :key="e.id" @click="toggleEmp(e.id)" 
                                               :class="form.selected.includes(e.id) ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow-lg shadow-brand-indigo/10 border-transparent' : 'bg-slate-900/30 text-slate-400 border-slate-800/80'"
                                               class="p-4 rounded-2xl font-bold text-left flex justify-between items-center transition-all border hover:border-slate-700/80">
                                            <div class="flex flex-col">
                                                <span class="text-xs" :class="form.selected.includes(e.id) ? 'text-white' : 'text-slate-200'">{{e.name}}</span>
                                                <span class="text-[8px] uppercase tracking-wide mt-0.5" :class="form.selected.includes(e.id) ? 'text-indigo-200' : 'text-slate-400'">
                                                    Total pe data aleasă: {{ getSelectedDateEmpHours(e.id) }}h
                                                </span>
                                            </div>
                                            <span v-if="form.selected.includes(e.id)" class="bg-white/20 w-5 h-5 rounded-full flex items-center justify-center text-xs">✓</span>
                                        </button>
                                    </div>
                                </div>

                                <!-- PREVENIRE STRICTĂ ORE ZERO -->
                                <button @click="saveLabor" :disabled="!form.siteId || !form.selected.length || !form.hours || form.hours <= 0 || loading"
                                        class="w-full bg-gradient-to-r from-brand-indigo to-brand-violet disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 text-white font-black py-4 rounded-2xl mt-8 shadow-xl shadow-brand-indigo/10 active:scale-95 transition-all text-xs tracking-wider">
                                    {{ loading ? 'SE SINCRONIZEAZĂ...' : 'SALVEAZĂ PONTAJ (' + form.selected.length + ')' }}
                                </button>
                            </div>
                        </div>

                        <!-- SECȚIUNE ADMIN: DECONT & MINUSURI (CU MULTIPLE TRANSFERURI & PLĂȚI MIXTE) -->
                        <div v-if="view === 'settlement'" class="space-y-4">
                            
                            <!-- Sub-taburi: Calculator Decont vs. Arhivă Deconturi -->
                            <div class="flex p-1 bg-slate-900/80 border border-slate-800/80 rounded-2xl shadow-lg items-center">
                                <button @click="settleSubTab = 'calc'" :class="settleSubTab === 'calc' ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow' : 'text-slate-400'" class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">
                                    💰 Calculator & Minusuri
                                </button>

                    } catch (e) { 
                        console.error(e); 
                    } finally { 
                        loading.value = false; 
                    }
                };

                const deleteLog = async (id) => { 
                    if (!user.value || !isAdmin.value) return;
                    if (deletingLogId.value !== id) {
                        deletingLogId.value = id;
                        setTimeout(() => { if (deletingLogId.value === id) deletingLogId.value = null; }, 3000);
                        return;
                    }
                    await fsDeleteDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'logs', id));
                    deletingLogId.value = null;
                    showToast('🗑️ Înregistrare ștearsă');
                };

                const getTodayLocalStr = () => {
                    const d = new Date();
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                };

                const getEmpRateForDate = (emp, dateStr) => {
                    if (!emp) return 0;
                    const fallback = parseFloat(emp.rate) || 0;
                    if (!Array.isArray(emp.rateHistory) || emp.rateHistory.length === 0) return fallback;

                    let target = dateStr ? String(dateStr).split('T')[0].trim() : getTodayLocalStr();
                    if (target.length === 7) target = `${target}-31`; // YYYY-MM -> capăt de lună

                    const sorted = emp.rateHistory
                        .filter(item => item && item.fromDate)
                        .map(item => ({ fromDate: String(item.fromDate).split('T')[0], rate: parseFloat(item.rate) || 0 }))
                        .sort((a, b) => a.fromDate.localeCompare(b.fromDate));

                    if (sorted.length === 0) return fallback;

                    let matched = sorted[0].rate;
                    for (const entry of sorted) {
                        if (entry.fromDate <= target) {
                            matched = entry.rate;
                        } else {
                            break;
                        }
                    }
                    return matched;
                };

                const onSettleEmpChange = () => {
                    const emp = employees.value.find(e => e.id === settleForm.eid);
                    if (emp) {
                        settleForm.rate = getEmpRateForDate(emp, settleForm.month);
                    }
                };

                watch(() => settleForm.month, () => {
                    if (settleForm.eid) {
                        onSettleEmpChange();
                    }
                });

                const settleAutoHours = computed(() => {
                    if (!settleForm.eid || !settleForm.month) return 0;
                    return logs.value
                        .filter(l => {
                            if (l.eid !== settleForm.eid) return false;
                            return l.date && l.date.startsWith(settleForm.month);
                        })
                        .reduce((sum, log) => sum + (parseFloat(log.h) || 0), 0);
                });

                const settleGross = computed(() => {
                    const h = parseFloat(settleForm.hours) || 0;
                    const r = parseFloat(settleForm.rate) || 0;
                    return toMoney(h * r);
                });

                const settleTotalDeductions = computed(() => {
                    const total = settleForm.deductions.reduce((acc, curr) => {
                        const val = parseFloat(curr.amount) || 0;
                        return acc + val;
                    }, 0);
                    return toMoney(total);
                });

                const settleNet = computed(() => {
                    return toMoney(settleGross.value - settleTotalDeductions.value);
                });

                const addSettleDeduction = (reason = '') => {
                    settleForm.deductions.push({
                        id: 'ded_' + Date.now() + Math.random(),
                        reason: reason || 'Scădere nouă',
                        amount: ''
                    });
                };

                const removeSettleDeduction = (id) => {
                    settleForm.deductions = settleForm.deductions.filter(d => d.id !== id);
                };

                // =========================================================
                // GESTIUNE TRANȘE MULTIPLE & PLĂȚI CU SUME DIFERITE
                // =========================================================

                const addPayment = (type = 'bank', defaultAmount = '') => {
                    const countOfType = settleForm.payments.filter(p => p.type === type).length;
                    const defaultNote = type === 'bank' ? `Transfer ${countOfType + 1}` : `Plată Cash ${countOfType + 1}`;
                    settleForm.payments.push({
                        id: 'pay_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                        type: type, // 'bank' sau 'cash'
                        amount: defaultAmount !== '' ? defaultAmount : '',
                        note: defaultNote
                    });
                };

                const removePayment = (id) => {
                    settleForm.payments = settleForm.payments.filter(p => p.id !== id);
                };

                const totalPaidBank = computed(() => {
                    const sum = (settleForm.payments || [])
                        .filter(p => p.type === 'bank')
                        .reduce((acc, p) => acc + (parseFloat(p.amount) || 0), 0);
                    return toMoney(sum);
                });

                const totalPaidCash = computed(() => {
                    const sum = (settleForm.payments || [])
                        .filter(p => p.type === 'cash')
                        .reduce((acc, p) => acc + (parseFloat(p.amount) || 0), 0);
                    return toMoney(sum);
                });

                const totalPaidAll = computed(() => {
                    return toMoney(totalPaidBank.value + totalPaidCash.value);
                });

                const remainingBalance = computed(() => {
                    return toMoney(settleNet.value - totalPaidAll.value);
                });

                const fillRemainingAsTransfer = () => {
                    const rem = remainingBalance.value;
                    if (rem > 0) {
                        addPayment('bank', rem);
                    } else if (settleForm.payments.length === 0 && settleNet.value > 0) {
                        addPayment('bank', settleNet.value);
                    }
                };

                const fillRemainingAsCash = () => {
                    const rem = remainingBalance.value;
                    if (rem > 0) {
                        addPayment('cash', rem);
                    } else if (settleForm.payments.length === 0 && settleNet.value > 0) {
                        addPayment('cash', settleNet.value);
                    }
                };

                // Funcții ajutătoare universale pentru deconturi salvate în arhivă
                const getItemPayments = (item) => {
                    if (!item) return [];
                    if (Array.isArray(item.payments) && item.payments.length > 0) {
                        return item.payments;
                    }
                    // Retrocompatibilitate dacă decontul avea câmpurile vechi
                    const list = [];
                    const b = parseFloat(item.paidBank) || 0;
                    const c = parseFloat(item.paidCash) || 0;
                    if (b > 0) list.push({ type: 'bank', amount: b, note: 'Transfer Bancar' });
                    if (c > 0) list.push({ type: 'cash', amount: c, note: 'Numerar (Cash)' });
                    if (list.length === 0) {
                        const net = parseFloat(item.net) || 0;
                        if (item.paymentMethod === 'bank') list.push({ type: 'bank', amount: net, note: 'Transfer Bancar' });
                        else if (item.paymentMethod === 'cash') list.push({ type: 'cash', amount: net, note: 'Numerar' });
                    }
                    return list;
                };

                const getItemPaidTotal = (item) => {
                    return toMoney(getItemPayments(item).reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0));
                };

                const getItemRemaining = (item) => {
                    const net = parseFloat(item?.net) || 0;
                    return toMoney(Math.max(0, net - getItemPaidTotal(item)));
                };

                const formatPaymentBadge = (item) => {
                    if (!item) return '';
                    const pays = getItemPayments(item);
                    if (pays.length > 1) {
                        const bankCount = pays.filter(p => p.type === 'bank').length;
                        const cashCount = pays.filter(p => p.type === 'cash').length;
                        if (bankCount > 0 && cashCount > 0) return `🔄 ${pays.length} Tranșe (Bancă + Cash)`;
                        if (bankCount > 1) return `🏦 ${bankCount} Transferuri`;
                        return `💵 ${cashCount} Tranșe Cash`;
                    }
                    if (pays.length === 1) {
                        return pays[0].type === 'bank' ? '🏦 Transfer Bancar' : '💵 Cash';
                    }
                    return item.paymentMethod === 'bank' ? '🏦 Bancă' : '💵 Cash';
                };

                const formatPaymentDescription = (item) => {
                    const pays = getItemPayments(item);
                    if (pays.length === 0) return 'plată directă';
                    if (pays.length === 1) return pays[0].type === 'bank' ? 'transfer bancar' : 'numerar';
                    return `${pays.length} tranșe (transferuri și cash)`;
                };

                const existingSettlementForSelection = computed(() => {
                    if (!settleForm.eid || !settleForm.month) return null;
                    return settlements.value.find(s => s.eid === settleForm.eid && s.month === settleForm.month);
                });

                const loadExistingSettlement = (item) => {
                    if (!item) return;
                    settleForm.month = item.month || settleForm.month;
                    settleForm.eid = item.eid || settleForm.eid;

                    settleForm.rate = item.rate || 0;
                    settleForm.status = item.status || 'approved';
                    settleForm.paymentMethod = item.paymentMethod || 'multiple';
                    
                    // Încarcă tranșele salvate sau generează din valorile vechi
                    settleForm.payments = getItemPayments(item).map(p => ({
                        id: p.id || ('pay_' + Math.random().toString(36).substring(2, 7)),
                        type: p.type || 'bank',
                        amount: parseFloat(p.amount) || '',
                        note: p.note || ''
                    }));

                    if (Array.isArray(item.deductions) && item.deductions.length > 0) {

                            id: d.id || ('ded_' + Math.random()),
                            reason: d.reason,
                            amount: d.amount
                        }));
                    }
                    showToast('📥 Decont încărcat în calculator!');
                };

                const saveSettlementToCloud = async () => {
                    if (!user.value || !isAdmin.value || !settleForm.eid) return;
                    loading.value = true;
                    
                    const cleanDeductions = settleForm.deductions
                        .filter(d => (parseFloat(d.amount) || 0) > 0)

                    const cleanPayments = (settleForm.payments || [])
                        .filter(p => (parseFloat(p.amount) || 0) > 0)
                        .map(p => ({
                            id: p.id || ('pay_' + Math.random().toString(36).substring(2, 6)),
                            type: p.type || 'bank',
                            amount: toMoney(p.amount),
                            note: p.note || (p.type === 'bank' ? 'Transfer' : 'Cash')
                        }));

                    const emp = employees.value.find(e => e.id === settleForm.eid);

                    const record = {
                        eid: settleForm.eid,
                        workerName: emp?.name || 'Muncitor',
                        month: settleForm.month,
                        hours: parseFloat(settleForm.hours) || 0,
                        rate: parseFloat(settleForm.rate) || 0,
                        gross: settleGross.value,
                        deductions: cleanDeductions,
                        totalDeductions: settleTotalDeductions.value,
                        net: settleNet.value,
                        status: settleForm.status || (remainingBalance.value === 0 && cleanPayments.length > 0 ? 'paid' : 'approved'),
                        paymentMethod: cleanPayments.length > 1 ? 'multiple' : (cleanPayments[0]?.type || 'bank'),
                        payments: cleanPayments,
                        paidBank: totalPaidBank.value,
                        paidCash: totalPaidCash.value,
                        totalPaid: totalPaidAll.value,
                        remainingBalance: remainingBalance.value,
                        updatedAt: Date.now()
                    };

                    try {
                        if (existingSettlementForSelection.value) {
                            await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'settlements', existingSettlementForSelection.value.id), record);
                            showToast(`🔄 Decont actualizat pentru ${record.workerName}!`);
                        } else {
                            record.createdAt = Date.now();
                            await fsAddDoc(fsCollection(db, 'artifacts', appId, 'public', 'data', 'settlements'), record);
                            showToast(`💾 Decont salvat pentru ${record.workerName}!`);
                        }
                        settleSubTab.value = 'archive';
                    } catch (e) {
                        console.error("Eroare la salvare decont:", e);
                    } finally {
                        loading.value = false;
                    }
                };

                const updateSettlementStatus = async (id, newStatus) => {
                    if (!user.value || !isAdmin.value) return;
                    try {
                        await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'settlements', id), {
                            status: newStatus
                        });
                        const statusLabel = newStatus === 'paid' ? 'PLĂTIT' : newStatus === 'approved' ? 'APROBAT' : 'SCHIȚĂ';
                        showToast(`Stare: ${statusLabel}`);
                    } catch (e) {
                        console.error(e);
                    }
                };

                const deleteSettlement = async (id) => {
                    if (!user.value || !isAdmin.value) return;
                    await fsDeleteDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'settlements', id));
                    showToast('🗑️ Decont șters din istoric');
                };

                // GENERARE MESAJ DETALIAT WHATSAPP CU TOATE TRANȘELE ȘI TRANSFERURILE
                const copyWhatsAppSettlement = () => {

                    const validPayments = settleForm.payments.filter(p => (parseFloat(p.amount) || 0) > 0);

                    msg += `⏱️ *Ore lucrate:* ${settleForm.hours || 0} ore × €${settleForm.rate || 0}/h = *€${settleGross.value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}*\n\n`;

                    if (validDeductions.length > 0) {
                        msg += `🔻 *SCĂDERI & MINUSURI (-€${settleTotalDeductions.value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}):*\n`;
                        validDeductions.forEach(d => {
                            msg += ` • ${d.reason}: -€${parseFloat(d.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                        });
                        msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
                    } else {
                        msg += `🔻 *Fără scăderi / minusuri.*\n━━━━━━━━━━━━━━━━━━━━━\n`;
                    }

                    msg += `💰 *TOTAL NET DE DAT: €${settleNet.value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}*\n`;

                    if (validPayments.length > 0) {

                        validPayments.forEach((p, idx) => {

                        msg += `✅ *Total achitat:* €${totalPaidAll.value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                        if (remainingBalance.value > 0) {
                            msg += `⏳ *Rest rămas de achitat:* €${remainingBalance.value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                        } else {
                            msg += `🎯 *Sold achitat complet (0 rest).* \n`;

                    }

                    copyTextToClipboard(msg);
                };

                const copySpecificSettlement = (item) => {
                    const empName = (item.workerName || getEmpName(item.eid)).toUpperCase();
                    const statusName = item.status === 'paid' ? 'PLĂTIT' : item.status === 'approved' ? 'APROBAT' : 'SCHIȚĂ';
                    const pays = getItemPayments(item);

                    let msg = `📋 *DECONT SALARIU - ${empName}*\n`;
                    msg += `🗓️ *Luna:* ${formatMonth(item.month)}\n`;
                    msg += `📌 *Stare:* ${statusName}\n`;
                    msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
                    msg += `⏱️ *Ore lucrate:* ${item.hours} ore × €${item.rate}/h = *€${(item.gross || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}*\n\n`;

                    if (item.deductions && item.deductions.length > 0) {
                        msg += `🔻 *SCĂDERI & MINUSURI (-€${(item.totalDeductions || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}):*\n`;
                        item.deductions.forEach(d => {

                    }

                    msg += `💰 *TOTAL NET: €${(item.net || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}*\n`;

                    if (pays.length > 0) {
                        msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
                        msg += `💳 *TRANSFERURI & PLĂȚI EFECTUATE:*\n`;
                        pays.forEach((p, idx) => {

                            const label = p.note ? p.note : (p.type === 'bank' ? `Transfer ${idx + 1}` : `Cash`);
                            msg += ` • ${icon} ${label}: *€${parseFloat(p.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}*\n`;
                        });
                        msg += `━━━━━━━━━━━━━━━━━━━━━\n`;

                        if (remaining > 0) {

                        } else {
                            msg += `🎯 *Sold achitat 100% integral.*\n`;
                        }
                    }

                    copyTextToClipboard(msg);
                };

                const sortedSettlements = computed(() => {
                    return [...settlements.value].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                });

                const filteredSettlements = computed(() => {
                    return sortedSettlements.value.filter(s => {
                        const matchWorker = !settleArchiveFilterEid.value || s.eid === settleArchiveFilterEid.value;
                        const matchStatus = !settleArchiveFilterStatus.value || (s.status || 'approved') === settleArchiveFilterStatus.value;
                        
                        let matchMethod = true;
                        if (settleArchiveFilterPaymentMethod.value) {
                            const pays = getItemPayments(s);
                            if (settleArchiveFilterPaymentMethod.value === 'multiple') matchMethod = pays.length > 1;
                            else if (settleArchiveFilterPaymentMethod.value === 'bank') matchMethod = pays.some(p => p.type === 'bank');
                            else if (settleArchiveFilterPaymentMethod.value === 'cash') matchMethod = pays.some(p => p.type === 'cash');
                        }

                        return matchWorker && matchStatus && matchMethod;
                    });
                });

                const openEditLog = (log) => {
                    editingLog.value = { 
                        id: log.id,
                        date: log.date,
                        h: parseFloat(log.h) || 0,
                        eid: log.eid,
                        sid: log.sid
                    };
                };

                const cancelEditLog = () => {
                    editingLog.value = null;
                };

                const saveEditLog = async () => {
                    if (!editingLog.value || !user.value || !isAdmin.value) return;
                    loading.value = true;
                    try {
                        const { id, date, h, eid, sid } = editingLog.value;
                        await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'logs', id), {
                            date,
                            h: parseFloat(h) || 0,
                            eid,
                            sid
                        });
                        editingLog.value = null;

                    } catch (e) {

                        showToast('❌ Eroare la actualizare');
                    } finally {
                        loading.value = false;
                    }
                };

                // Funcții editare articol deviz / lucrare șantier
                const openEditSiteItem = (siteId, item) => {
                    editingSiteItem.value = {

                        id: item.id,
                        desc: item.desc,
                        qty: item.qty,
                        unit: item.unit || 'm2',

                        sentToManager: !!item.sentToManager
                    };

                                    desc: (desc || '').trim(),

                                    date: isExtra ? (date || getTodayLocalStr()) : (date || ''),
                                    sentToManager: !!sentToManager
                                };

                        showToast('❌ Eroare la actualizarea lucrării');

                // Preluare plată / decont asociat strict lunii sau perioadei selectate de muncitor
                const myCurrentTimeframeSettlement = computed(() => {
                    if (isAdmin.value || !currentUserEmployee.value) return null;
                    const myEid = currentUserEmployee.value.id;
                    let targetMonth = '';
                    if (statTimeframe.value === 'Month') {
                        targetMonth = selectedMonth.value || getSelectedMonthStr.value;
                    } else if (statTimeframe.value === 'Week') {
                        const dates = getWeekDates();
                        targetMonth = dates.length > 0 ? dates[0].dateStr.slice(0, 7) : getSelectedMonthStr.value;

                        .filter(s => s.eid === myEid && s.month === targetMonth)
                        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] || null;

                    return settlements.value
                        .filter(s => s.eid === myEid)
                        .sort((a, b) => (b.month || '').localeCompare(a.month || ''));

                const myLatestSettlement = computed(() => {

                    const myEid = currentUserEmployee.value.id;
