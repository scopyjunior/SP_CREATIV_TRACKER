                        .filter(s => s.eid === myEid)
                        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] || null;
                });

                const calculateSiteTotal = (sid) => {
                    const total = (sites.value.find(x => x.id === sid)?.pricingItems || []).reduce((a, b) => {
                        return a + ((parseFloat(b.qty)||0) * (parseFloat(b.price)||0));
                    }, 0);
                    return toMoney(total);
                };

                const calculateSitePaid = (sid) => {
                    const s = sites.value.find(x => x.id === sid);
                    if (!s) return 0;
                    if (s.isPaid) return calculateSiteTotal(sid);
                    const total = (s.pricingItems || []).reduce((a, b) => {
                        const pct = parseFloat(b.paidPercent) || 0;
                        const value = (parseFloat(b.qty)||0) * (parseFloat(b.price)||0);
                        return a + (value * (pct / 100));
                    }, 0);
                    return toMoney(total);
                };

                const calculateSiteOwed = (sid) => {
                    const s = sites.value.find(x => x.id === sid);
                    if (!s || s.isPaid) return 0;
                    const total = (s.pricingItems || []).reduce((a, b) => {
                        const pct = parseFloat(b.paidPercent) || 0;
                        const value = (parseFloat(b.qty)||0) * (parseFloat(b.price)||0);
                        return a + (value * (1 - (pct / 100)));
                    }, 0);
                    return toMoney(total);
                };

                const getAllTimeSiteHours = (sid) => logs.value.filter(l => l.sid === sid).reduce((a, b) => a + (parseFloat(b.h)||0), 0);

                const calculateSiteYield = (sid) => {
                    const rev = calculateSiteTotal(sid);
                    const hrs = getAllTimeSiteHours(sid);
                    return hrs > 0 ? Math.round(rev / hrs) : 0;
                };

                const quickUnitOptions = ['m2', 'ore', 'buc', 'ml', 'forfet'];

                const setPriceFormMode = (sid, mode) => {
                    if (!priceForm[sid]) return;
                    priceForm[sid].mode = mode;
                    if (mode === 'extra') {
                        priceForm[sid].unit = 'ore';
                        if (!priceForm[sid].date) priceForm[sid].date = getTodayLocalStr();
                    } else if (mode === 'invoice') {
                        priceForm[sid].unit = 'forfet';
                        priceForm[sid].qty = 1;
                    } else {
                        if (priceForm[sid].unit === 'forfet') priceForm[sid].unit = 'm2';
                    }
                };

                const setPriceFormUnit = (sid, unit) => {
                    if (!priceForm[sid]) return;
                    priceForm[sid].unit = unit;
                    if (unit === 'forfet') priceForm[sid].qty = 1;
                };

                const fillRegieSiteHours = (sid) => {
                    if (!priceForm[sid]) return;
                    const hrs = getAllTimeSiteHours(sid);
                    priceForm[sid].unit = 'ore';
                    priceForm[sid].qty = hrs > 0 ? hrs : 1;
                    if (!(priceForm[sid].desc || '').trim()) {
                        priceForm[sid].desc = 'Lucrări în Regie';
                    }
                };

                const addItemToSite = async (sid) => {
                    if (!user.value || !isAdmin.value || !priceForm[sid]) return;
                    const s = sites.value.find(x => x.id === sid);
                    if (!s) return;
                    const f = priceForm[sid];
                    const desc = (f.desc || '').trim();
                    if (!desc) return;

                    const isExtra = f.mode === 'extra';
                    const isInvoice = f.mode === 'invoice';
                    const newItem = {
                        id: Date.now() + Math.floor(Math.random() * 1000),
                        desc,
                        qty: isInvoice ? 1 : (parseFloat(f.qty) || 1),
                        unit: isInvoice ? 'forfet' : ((f.unit || '').trim() || 'm2'),
                        price: parseFloat(f.price) || 0,
                        paidPercent: 0,
                        isExtra,
                        date: isExtra ? (f.date || getTodayLocalStr()) : '',
                        sentToManager: false
                    };

                    loading.value = true;
                    try {
                        const items = [...(s.pricingItems || []), newItem];
                        await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', sid), { pricingItems: items });
                        f.desc = '';
                        f.qty = 1;
                        f.price = '';
                        if (isExtra) {
                            f.date = getTodayLocalStr();
                            showToast('⚡ Extra / Regie salvat!');
                        } else if (isInvoice) {
                            showToast('🧾 Total factură salvat!');
                        } else {
                            showToast('✅ Articol adăugat în deviz!');
                        }
                    } catch (e) {
                        console.error('Eroare adăugare articol:', e);
                        showToast('❌ Eroare la salvarea articolului');
                    } finally {
                        loading.value = false;
                    }
                };

                // Extra / Regie Tracker & Export Manager
                const getSiteExtras = (site) => (site?.pricingItems || []).filter(i => !!i.isExtra);
                const getSiteUnsentExtras = (site) => (site?.pricingItems || []).filter(i => !!i.isExtra && !i.sentToManager);

                const toggleExtraSent = async (sid, iid) => {
                    if (!user.value || !isAdmin.value) return;
                    const s = sites.value.find(x => x.id === sid);
                    if (!s) return;
                    let nextState = false;
                    const items = (s.pricingItems || []).map(i => {
                        if (i.id === iid) {
                            nextState = !i.sentToManager;
                            return { ...i, sentToManager: nextState };
                        }
                        return i;
                    });
                    await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', sid), { pricingItems: items });
                    showToast(nextState ? '✅ Marcat ca trimis la manager' : '⏳ Marcat ca netrimis');
                };

                const markAllExtrasSent = async (sid) => {
                    if (!user.value || !isAdmin.value) return;
                    const s = sites.value.find(x => x.id === sid);
                    if (!s) return;
                    const items = (s.pricingItems || []).map(i => i.isExtra ? { ...i, sentToManager: true } : i);
                    await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', sid), { pricingItems: items });
                    showToast('✅ Toate extra-urile marcate ca trimise!');
                };

                const copySiteExtrasForManager = (site, onlyUnsent = true) => {
                    if (!site) return;
                    const unsent = getSiteUnsentExtras(site);
                    const list = (onlyUnsent && unsent.length > 0) ? unsent : getSiteExtras(site);
                    if (list.length === 0) return;

                    let msg = `⚡ *LUCRĂRI EXTRA / REGIE - ${site.name}*\n`;
                    msg += `━━━━━━━━━━━━━━━━━━━━━\n`;

                    list.forEach(item => {
                        const qty = parseFloat(item.qty) || 0;
                        const unit = (item.unit || '').trim();
                        const dateTag = item.date ? `[${item.date}] ` : '';
                        msg += `• ${dateTag}${item.desc}: *${qty}${unit ? ' ' + unit : ''}*\n`;
                    });

                    copyTextToClipboard(msg.trim());
                };

                // Import Rapid prin Lipire din Factură (PDF / Excel / WhatsApp)
                const invoicePasteModal = ref(null);

                const parseEuroNumber = (raw) => {
                    if (raw === null || raw === undefined) return NaN;
                    let s = String(raw).replace(/[€$£\s]/g, '').replace(/(eur|euro|lei|ron)/gi, '').trim();
                    if (!s) return NaN;
                    if (s.includes(',') && s.includes('.')) {
                        if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
                            s = s.replace(/\./g, '').replace(',', '.');
                        } else {
                            s = s.replace(/,/g, '');
                        }
                    } else if (s.includes(',')) {
                        s = s.replace(',', '.');
                    }
                    const n = parseFloat(s);
                    return isNaN(n) ? NaN : n;
                };

                const normalizeUnitToken = (u) => {
                    const low = (u || '').toLowerCase().replace(/\./g, '').trim();
                    if (['m2', 'mp', 'sqm', 'm²'].includes(low)) return 'm2';
                    if (['ore', 'ora', 'oră', 'h', 'hr', 'hrs', 'u', 'uur', 'uren', 'std', 'stunde', 'stunden'].includes(low)) return 'ore';
                    if (['buc', 'pcs', 'pc', 'stk', 'st', 'stuk', 'stuks', 'piece', 'pieces'].includes(low)) return 'buc';
                    if (['ml', 'm', 'lm', 'lfm'].includes(low)) return 'ml';
                    if (['forfet', 'psch', 'pausch', 'pauschal', 'ans', 'set', 'lot', 'fact'].includes(low)) return 'forfet';
                    return '';
                };

                const openInvoicePasteModal = (site) => {
                    if (!site) return;
                    invoicePasteModal.value = {
                        siteId: site.id,
                        siteName: site.name,
                        rawText: '',
                        isExtra: false,
                        rows: []
                    };
                };

                const closeInvoicePasteModal = () => {
                    invoicePasteModal.value = null;
                };

                const parseInvoiceText = () => {
                    if (!invoicePasteModal.value) return;
                    const lines = (invoicePasteModal.value.rawText || '')
                        .split(/\r?\n/)
                        .map(l => l.trim())
                        .filter(Boolean);

                    const parsed = [];
                    const skipHeaderRegex = /^(nr\.?|crt\.?|descriere|denumire|articol|cantitate|u\.?m\.?|pre[țt]|valoare|total|subtotal|tva|mwst|netto|brutto|excl\.?|vat|incl\.?|quant\.?)\b/i;

                    lines.forEach((line, idx) => {
                        // Sare peste linia de antet (inclusiv "Excl. VAT % Incl. Quant. Unit Discount % Tot. Excl. Tot. Incl.")
                        if (/\bincl\.?/i.test(line) && /\bquant\.?/i.test(line)) return;
                        if (skipHeaderRegex.test(line) && !/\d/.test(line)) return;

                        // 1. Format tabelar (tab-separated, păstrând coloanele goale pentru Unit / Discount %)
                        if (line.includes('\t')) {
                            const rawCols = line.split('\t').map(c => c.trim());

                            // 1a. Format exact factură: Desc | Excl. | VAT % | Incl. | Quant. | Unit | Discount % | Tot. Excl. | Tot. Incl.
                            if (rawCols.length >= 5) {
                                const descCol = rawCols[0];
                                const exclNum = parseEuroNumber(rawCols[1]);
                                const vatNum = parseEuroNumber(rawCols[2]);
                                const inclNum = parseEuroNumber(rawCols[3]);
                                const quantNum = parseEuroNumber(rawCols[4]);

                                if (descCol && !/^[\d.,]+$/.test(descCol) && !isNaN(exclNum) && !isNaN(vatNum) && !isNaN(inclNum) && !isNaN(quantNum)) {
                                    const explicitUnit = normalizeUnitToken(rawCols[5] || '');
                                    const fallbackUnit = /\bregie\b/i.test(descCol) ? 'ore' : 'm2';
                                    parsed.push({
                                        id: 'inv_' + Date.now() + '_' + idx,
                                        desc: descCol,
                                        qty: quantNum > 0 ? quantNum : 1,
                                        unit: explicitUnit || fallbackUnit,
                                        price: toMoney(inclNum)
                                    });
                                    return;
                                }
                            }

                            // 1b. Format tabelar generic (Excel / PDF)
                            const cols = rawCols.filter(Boolean);
                            if (cols.length >= 2) {
                                let descParts = [];
                                let unit = '';
                                const nums = [];
                                cols.forEach((col, cIdx) => {
                                    if (cIdx === 0 && /^\d+\.?$/.test(col) && cols.length >= 3) return;
                                    const uFound = normalizeUnitToken(col);
                                    if (uFound && !unit) { unit = uFound; return; }
                                    const num = parseEuroNumber(col);
                                    if (!isNaN(num) && /^[\d.,\s€$£euronlei-]+$/i.test(col)) {
                                        nums.push(num);
                                    } else {
                                        const mCombo = col.match(/^([\d.,]+)\s*(m2|m²|mp|ore|ora|h|u|uur|std|buc|st|stk|ml|forfet|psch)$/i);
                                        if (mCombo) {
                                            nums.push(parseEuroNumber(mCombo[1]));
                                            if (!unit) unit = normalizeUnitToken(mCombo[2]);
                                        } else {
                                            descParts.push(col);
                                        }
                                    }
                                });
                                const desc = descParts.join(' ').trim();
                                if (desc && nums.length >= 6) {
                                    // Rezervă dacă tab-urile goale au dispărut: [Excl, VAT, Incl, Quant, TotExcl, TotIncl]
                                    const inclVal = nums[2];
                                    const quantVal = nums[3];
                                    const fallbackUnit = /\bregie\b/i.test(desc) ? 'ore' : 'm2';
                                    parsed.push({
                                        id: 'inv_' + Date.now() + '_' + idx,
                                        desc,
                                        qty: quantVal > 0 ? quantVal : 1,
                                        unit: unit || fallbackUnit,
                                        price: toMoney(inclVal)
                                    });
                                    return;
                                }
                                if (desc && nums.length > 0) {
                                    const qty = nums.length >= 2 ? nums[0] : 1;
                                    const price = nums.length >= 2 ? nums[1] : nums[0];
                                    parsed.push({
                                        id: 'inv_' + Date.now() + '_' + idx,
                                        desc,
                                        qty: qty > 0 ? qty : 1,
                                        unit: unit || (nums.length >= 2 ? 'm2' : 'forfet'),
                                        price: toMoney(price)
                                    });
                                    return;
                                }
                            }
                        }

                        // 2. Format cu spații multiple din aceeași factură (6 numere la final: Excl VAT Incl Quant TotExcl TotIncl)
                        const mSixCols = line.match(/^(.+?)\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)(?:\s+([a-zA-Z²]+))?\s+([\d.,]+)\s+([\d.,]+)$/);
                        if (mSixCols) {
                            const desc = mSixCols[1].trim();
                            const inclVal = parseEuroNumber(mSixCols[4]);
                            const quantVal = parseEuroNumber(mSixCols[5]);
                            const unit = normalizeUnitToken(mSixCols[6] || '') || (/\bregie\b/i.test(desc) ? 'ore' : 'm2');
                            if (desc && !isNaN(inclVal) && !isNaN(quantVal)) {
                                parsed.push({
                                    id: 'inv_' + Date.now() + '_' + idx,
                                    desc,
                                    qty: quantVal > 0 ? quantVal : 1,
                                    unit,
                                    price: toMoney(inclVal)
                                });
                                return;
                            }
                        }

                        // 3. Format text liber: "Fațadă 120 m2 x 35", "Regie 16 ore 45€", "Ușă 2 buc * 80"
                        const mFull = line.match(/^(.+?)\s+([\d.,]+)\s*(m2|m²|mp|ore|ora|oră|h|u|uur|std|buc|st|stk|ml|forfet|psch)?\s*(?:x|\*|×|la|@|-)?\s*€?\s*([\d.,]+)\s*(?:€|eur|euro|lei|ron)?$/i);
                        if (mFull) {
                            const desc = mFull[1].replace(/^\d+[.)]\s*/, '').replace(/[-–:]+$/, '').trim();
                            const qty = parseEuroNumber(mFull[2]);
                            const unit = normalizeUnitToken(mFull[3]) || (/\bregie\b/i.test(desc) ? 'ore' : 'm2');
                            const price = parseEuroNumber(mFull[4]);
                            if (desc && !isNaN(qty) && !isNaN(price)) {
                                parsed.push({
                                    id: 'inv_' + Date.now() + '_' + idx,
                                    desc,
                                    qty: qty > 0 ? qty : 1,
                                    unit,
                                    price: toMoney(price)
                                });
                                return;
                            }
                        }

                        // 4. Format simplu 1 sumă: "Reparație fațadă 450€"
                        const mSimple = line.match(/^(.+?)\s+[-–:]?\s*€?\s*([\d.,]+)\s*(?:€|eur|euro|lei|ron)?$/i);
                        if (mSimple) {
                            const desc = mSimple[1].replace(/^\d+[.)]\s*/, '').replace(/[-–:]+$/, '').trim();
                            const price = parseEuroNumber(mSimple[2]);
                            if (desc && !isNaN(price) && price > 0) {
                                parsed.push({
                                    id: 'inv_' + Date.now() + '_' + idx,
                                    desc,
                                    qty: 1,
                                    unit: 'forfet',
                                    price: toMoney(price)
                                });
                            }
                        }
                    });

                    invoicePasteModal.value.rows = parsed;
                    if (parsed.length === 0) {
                        showToast('⚠️ Nu am găsit linii valide — poți adăuga manual mai jos');
                    } else {
                        showToast(`📋 ${parsed.length} ${parsed.length === 1 ? 'linie detectată' : 'linii detectate'}!`);
                    }
                };

                const addEmptyInvoiceRow = () => {
                    if (!invoicePasteModal.value) return;
                    invoicePasteModal.value.rows.push({
                        id: 'inv_' + Date.now() + '_' + Math.random(),
                        desc: '',
                        qty: 1,
                        unit: 'm2',
                        price: ''
                    });
                };

                const removeInvoiceRow = (idx) => {
                    if (!invoicePasteModal.value) return;
                    invoicePasteModal.value.rows.splice(idx, 1);
                };

                const saveParsedInvoiceItems = async () => {
                    if (!user.value || !isAdmin.value || !invoicePasteModal.value) return;
                    const { siteId, rows, isExtra } = invoicePasteModal.value;
                    const s = sites.value.find(x => x.id === siteId);
                    if (!s) return;

                    const validRows = rows
                        .filter(r => (r.desc || '').trim())
                        .map((r, idx) => ({
                            id: Date.now() + idx + Math.floor(Math.random() * 1000),
                            desc: r.desc.trim(),
                            qty: parseFloat(r.qty) || 1,
                            unit: (r.unit || '').trim() || 'm2',
                            price: parseFloat(r.price) || 0,
                            paidPercent: 0,
                            isExtra: !!isExtra,
                            date: isExtra ? getTodayLocalStr() : '',
                            sentToManager: false
                        }));

                    if (validRows.length === 0) return;

                    loading.value = true;
                    try {
                        const items = [...(s.pricingItems || []), ...validRows];
                        await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', siteId), { pricingItems: items });
                        invoicePasteModal.value = null;
                        showToast(`✅ ${validRows.length} ${validRows.length === 1 ? 'articol adăugat' : 'articole adăugate'}!`);
                    } catch (e) {
                        console.error('Eroare import factură:', e);
                        showToast('❌ Eroare la salvarea articolelor');
                    } finally {
                        loading.value = false;
                    }
                };

                // =========================================================
                // LOCAȚIE GPS & NAVIGAȚIE RAPIDĂ (WAZE / GOOGLE MAPS)
                // =========================================================
                const editingSiteLocation = ref(null);
                const workerSiteSearch = ref('');

                const selectedSiteObject = computed(() => {
                    if (!form.value.siteId) return null;
                    return sites.value.find(s => s.id === form.value.siteId) || null;
                });

                const getSiteObject = (sid) => sites.value.find(s => s.id === sid) || null;

                const hasSiteLocation = (site) => {
                    if (!site) return false;
                    const hasCoords = !!(site.lat && site.lng);
                    const hasAddr = !!(site.address && String(site.address).trim());
                    const hasUrl = !!(site.mapsUrl && String(site.mapsUrl).trim());
                    return hasCoords || hasAddr || hasUrl;
                };

                const getSiteLocationSummary = (site) => {
                    if (!site) return '';
                    if (site.address && String(site.address).trim()) return String(site.address).trim();
                    if (site.lat && site.lng) return `${site.lat}, ${site.lng}`;
                    if (site.mapsUrl && String(site.mapsUrl).trim()) return 'Link hartă salvat';
                    return '';
                };

                const filteredWorkerSites = computed(() => {
                    const q = (workerSiteSearch.value || '').toLowerCase().trim();
                    return activeSites.value.filter(s => {
                        if (!q) return true;
                        const nameMatch = s.name && s.name.toLowerCase().includes(q);
                        const addrMatch = s.address && s.address.toLowerCase().includes(q);
                        return nameMatch || addrMatch;
                    });
                });

                const openInWaze = (site) => {
                    if (!site) return;
                    if (site.lat && site.lng) {
                        window.open(`https://waze.com/ul?ll=${encodeURIComponent(String(site.lat).trim() + ',' + String(site.lng).trim())}&navigate=yes`, '_blank', 'noopener');
                    } else if (site.address && String(site.address).trim()) {
                        window.open(`https://waze.com/ul?q=${encodeURIComponent(String(site.address).trim())}&navigate=yes`, '_blank', 'noopener');
                    } else if (site.mapsUrl && /^https?:\/\//i.test(String(site.mapsUrl).trim())) {
                        window.open(String(site.mapsUrl).trim(), '_blank', 'noopener');
                    } else {
                        showToast('⚠️ Șantierul nu are adresă sau coordonate');
                    }
                };

                const openInMaps = (site) => {
                    if (!site) return;
                    if (site.lat && site.lng) {
                        window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(String(site.lat).trim() + ',' + String(site.lng).trim())}`, '_blank', 'noopener');
                    } else if (site.mapsUrl && /^https?:\/\//i.test(String(site.mapsUrl).trim())) {
                        window.open(String(site.mapsUrl).trim(), '_blank', 'noopener');
                    } else if (site.address && String(site.address).trim()) {
                        window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(String(site.address).trim())}`, '_blank', 'noopener');
                    } else {
                        showToast('⚠️ Șantierul nu are adresă sau coordonate');
                    }
                };

                const copySiteLocation = (site) => {
                    if (!site) return;
                    const parts = [];
                    if (site.name) parts.push(`📍 *${site.name}*`);
                    if (site.address && String(site.address).trim()) parts.push(`Adresă: ${String(site.address).trim()}`);
                    if (site.lat && site.lng) {
                        parts.push(`GPS: ${site.lat}, ${site.lng}`);
                        parts.push(`Maps: https://www.google.com/maps/dir/?api=1&destination=${site.lat},${site.lng}`);
                        parts.push(`Waze: https://waze.com/ul?ll=${site.lat},${site.lng}&navigate=yes`);
                    } else if (site.mapsUrl && String(site.mapsUrl).trim()) {
                        parts.push(`Link: ${String(site.mapsUrl).trim()}`);
                    } else if (site.address && String(site.address).trim()) {
                        parts.push(`Maps: https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(String(site.address).trim())}`);
                    }
                    if (parts.length <= 1) {
                        showToast('⚠️ Șantierul nu are locație salvată');
                        return;
                    }
                    copyTextToClipboard(parts.join('\n'));
                };

                const openEditSiteLocation = (site) => {
                    if (!site) return;
                    editingSiteLocation.value = {
                        siteId: site.id,
                        siteName: site.name,
                        lat: site.lat || '',
                        lng: site.lng || '',
                        address: site.address || '',
                        mapsUrl: site.mapsUrl || '',
                        quickPaste: '',
                        isDetectingGps: false
                    };
                };

                const cancelEditSiteLocation = () => {
                    editingSiteLocation.value = null;
                };

                const detectCurrentGpsForSite = () => {
                    if (!navigator.geolocation || !editingSiteLocation.value) {
                        showToast('⚠️ GPS indisponibil pe acest dispozitiv');
                        return;
                    }
                    editingSiteLocation.value.isDetectingGps = true;
                    navigator.geolocation.getCurrentPosition((pos) => {
                        if (editingSiteLocation.value) {
                            editingSiteLocation.value.lat = String(Number(pos.coords.latitude.toFixed(6)));
                            editingSiteLocation.value.lng = String(Number(pos.coords.longitude.toFixed(6)));
                            editingSiteLocation.value.isDetectingGps = false;
                            showToast('📍 Coordonate GPS preluate!');
                        }
                    }, () => {
                        if (editingSiteLocation.value) editingSiteLocation.value.isDetectingGps = false;
                        showToast('⚠️ Nu s-a putut citi GPS-ul (verifică permisiunea)');
                    }, { enableHighAccuracy: true, timeout: 10000 });
                };

                const handleLocationQuickPaste = () => {
                    if (!editingSiteLocation.value || !editingSiteLocation.value.quickPaste) return;
                    const val = editingSiteLocation.value.quickPaste.trim();

                    // Extrage coordonate din text sau din link Google Maps / Waze (ex: @51.0543,3.7174 sau 51.0543, 3.7174)
                    const m = val.match(/(-?\d{1,2}\.\d{3,})\s*[, ]\s*(-?\d{1,3}\.\d{3,})/);
                    if (m) {
                        editingSiteLocation.value.lat = m[1];
                        editingSiteLocation.value.lng = m[2];
                        if (/^https?:\/\//i.test(val)) {

                        return { state: 'expired', label: `🔴 Expirat de ${overdue} ${overdue === 1 ? 'zi' : 'zile'}` };
                    }
                    if (daysLeft === 0) {
                        return { state: 'expired', label: '🔴 Expiră AZI' };
                    }
                    if (daysLeft < 30) {
                        return { state: 'warning', label: `🟡 Expiră în ${daysLeft} ${daysLeft === 1 ? 'zi' : 'zile'}` };
                    }
                    return { state: 'valid', label: `🟢 Valabil (${daysLeft} zile)` };
                };

                const applyFleetPreset = (preset) => {
                    if (!preset) return;
                    newFleet.value.vehicle = preset.vehicle;
                    newFleet.value.type = preset.type;
                    if (!newFleet.value.expiryDate && preset.defaultMonths) {
                        newFleet.value.expiryDate = addMonthsToDateStr('', preset.defaultMonths);
                    }
                };

                const addFleetItem = async () => {
                    if (!user.value || !isAdmin.value) return;
                    const vehicle = (newFleet.value.vehicle || '').trim();
                    const type = (newFleet.value.type || '').trim();
                    const expiryDate = newFleet.value.expiryDate;
                    const notes = (newFleet.value.notes || '').trim();
                    if (!vehicle || !type || !expiryDate) return;

                    loading.value = true;
                    try {
                        await fsAddDoc(fsCollection(db, 'artifacts', appId, 'public', 'data', 'fleet'), {
                            vehicle,
                            type,
                            expiryDate,
                            notes,
                            createdAt: Date.now(),
                            updatedAt: Date.now()
                        });
                        newFleet.value = { vehicle: '', type: '', expiryDate: '', notes: '' };
                        showToast('🚐 Scadență salvată în cloud!');
                    } catch (e) {
                        console.error('Eroare salvare scadență flotă:', e);
                        showToast('❌ Eroare la salvarea scadenței');
                    } finally {
                        loading.value = false;
                    }
                };

                const renewFleetItem = async (id, months) => {
                    if (!user.value || !isAdmin.value) return;
                    const item = fleetList.value.find(i => i.id === id);
                    if (!item) return;

                    const baseDate = (item.daysLeft !== null && item.daysLeft < 0) ? '' : item.expiryDate;
                    const nextDate = addMonthsToDateStr(baseDate, months);

                    loading.value = true;
                    try {
                        await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'fleet', id), {
                            expiryDate: nextDate,
                            updatedAt: Date.now()
                        });
                        const label = months === 12 ? '+1 An' : `+${months} Luni`;
                        showToast(`🔄 Prelungit (${label}) până la ${nextDate}!`);
                    } catch (e) {
                        console.error('Eroare prelungire scadență:', e);
                        showToast('❌ Eroare la prelungirea scadenței');
                    } finally {
                        loading.value = false;
                    }
                };

                const deleteFleetItem = async (id) => {
                    if (!user.value || !isAdmin.value) return;
                    if (deletingFleetId.value !== id) {
                        deletingFleetId.value = id;
                        setTimeout(() => { if (deletingFleetId.value === id) deletingFleetId.value = null; }, 3000);
                        return;
                    }
                    loading.value = true;
                    try {
                        await fsDeleteDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'fleet', id));
                        deletingFleetId.value = null;
                        showToast('🗑️ Scadență ștearsă');
                    } catch (e) {
                        console.error('Eroare ștergere scadență:', e);
                        showToast('❌ Eroare la ștergerea scadenței');
                    } finally {
                        loading.value = false;
                    }
                };

                const copyFleetWhatsApp = (item) => {
                    if (!item) return;
                    const status = getFleetStatusInfo(item.daysLeft);
                    let msg = `⚠️ *ALERTĂ FLOTĂ SP CREATIV*\n`;
                    msg += `🚐 *Vehicul:* ${item.vehicle}\n`;
                    msg += `📋 *Document:* ${item.type}\n`;
                    msg += `📅 *Scadență:* ${item.expiryDate} (${status.label})\n`;
                    if (item.notes) msg += `📝 *Detalii:* ${item.notes}\n`;
                    copyTextToClipboard(msg);
                };

                // =========================================================
                // MODUL STATISTICI AVANSATE (PRO-RATA €/h & MULTI-LUNĂ)
                // =========================================================
                const showCrewCost = ref(true);

                const isDateInOffsetPeriod = (dateStr, timeframe, offset) => {
                    if (timeframe === 'All') return true;
                    if (!dateStr) return false;
                    const parts = dateStr.split('T')[0].split('-');
                    if (parts.length !== 3) return false;
                    const [y, m, d] = parts.map(Number);
                    const logD = new Date(y, m - 1, d, 12, 0, 0);
                    const now = new Date();
                    now.setHours(12, 0, 0, 0);

                    if (timeframe === 'Month') {
                        const targetMonth = new Date(now.getFullYear(), now.getMonth() + offset, 1, 12, 0, 0);
                        return logD.getFullYear() === targetMonth.getFullYear() && logD.getMonth() === targetMonth.getMonth();
                    }
                    if (timeframe === 'Week') {
                        const dayOfWeek = now.getDay();
                        const daysToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                        const targetMonday = new Date(now);
                        targetMonday.setDate(now.getDate() + daysToMonday + (offset * 7));
                        targetMonday.setHours(0, 0, 0, 0);
                        const targetSunday = new Date(targetMonday);
                        targetSunday.setDate(targetMonday.getDate() + 6);
                        targetSunday.setHours(23, 59, 59, 999);
                        return logD.getTime() >= targetMonday.getTime() && logD.getTime() <= targetSunday.getTime();
                    }
                    return true;
                };

                const avgFinishedHourlyRate = computed(() => {
                    let totalVal = 0;
                    let totalHrs = 0;
                    sites.value.forEach(s => {
                        if (!s.isPaid) return;
                        const hrs = getAllTimeSiteHours(s.id);
                        const tot = calculateSiteTotal(s.id);
                        if (hrs > 0 && tot > 0) {
                            totalVal += tot;
                            totalHrs += hrs;
                        }
                    });
                    if (totalHrs > 0) return totalVal / totalHrs;

                    // Rezervă: media pe șantierele care au deja încasări parțiale
                    sites.value.forEach(s => {
                        const hrs = getAllTimeSiteHours(s.id);
                        const paid = calculateSitePaid(s.id);
                        if (hrs > 0 && paid > 0) {
                            totalVal += paid;
                            totalHrs += hrs;
                        }
                    });
                    return totalHrs > 0 ? (totalVal / totalHrs) : 0;
                });

                const getSiteHourlyInfo = (site) => {
                    if (!site) return { mode: 'pending', hourlyRate: 0, allTimeHours: 0, siteTotal: 0, sitePaid: 0, siteOwed: 0 };
                    const siteTotal = calculateSiteTotal(site.id);
                    const sitePaid = calculateSitePaid(site.id);
                    const siteOwed = calculateSiteOwed(site.id);
                    const allTimeHours = getAllTimeSiteHours(site.id);

                    if (allTimeHours <= 0) {
                        return { mode: site.isPaid ? 'final' : 'pending', hourlyRate: 0, allTimeHours: 0, siteTotal, sitePaid, siteOwed };
                    }
                    if (site.isPaid) {
                        return { mode: 'final', hourlyRate: siteTotal / allTimeHours, allTimeHours, siteTotal, sitePaid, siteOwed };
                    }
                    if (sitePaid > 0) {
                        return { mode: 'stage', hourlyRate: sitePaid / allTimeHours, allTimeHours, siteTotal, sitePaid, siteOwed };
                    }
                    const baseRate = avgFinishedHourlyRate.value;
                    const effectiveRate = siteTotal > 0 ? Math.min(baseRate, siteTotal / allTimeHours) : baseRate;
                    return {
                        mode: effectiveRate > 0 ? 'estimated' : 'pending',
                        hourlyRate: effectiveRate,
                        allTimeHours,
                        siteTotal,
                        sitePaid,
                        siteOwed
                    };
                };

                const computePeriodStats = (dateMatcher, includeZeroHourFinished = false) => {
                    const periodLogs = logs.value.filter(l => dateMatcher(l.date));
                    const siteHoursMap = {};
                    const activeDateSet = new Set();
                    let totalHours = 0;
                    let laborCost = 0;

                    periodLogs.forEach(l => {
                        const h = parseFloat(l.h) || 0;
                        if (h <= 0) return;
                        totalHours += h;
                        if (l.date) activeDateSet.add(l.date.split('T')[0]);
                        siteHoursMap[l.sid] = (siteHoursMap[l.sid] || 0) + h;
                        const emp = employees.value.find(e => e.id === l.eid);
                        laborCost += h * getEmpRateForDate(emp, l.date);
                    });

                    let confirmedEarned = 0;
                    let inProgressEarned = 0;
                    const siteBreakdown = [];

                    sites.value.forEach(s => {
                        const periodHours = siteHoursMap[s.id] || 0;
                        const info = getSiteHourlyInfo(s);

                        if (periodHours > 0) {
                            const periodEarned = toMoney(info.hourlyRate * periodHours);
                            if (info.mode === 'final') confirmedEarned += periodEarned;
                            else inProgressEarned += periodEarned;

                            siteBreakdown.push({
                                id: s.id,
                                name: s.name,
                                isPaid: !!s.isPaid,
                                periodHours: toMoney(periodHours),
                                allTimeHours: toMoney(info.allTimeHours),
                                hourlyRate: toMoney(info.hourlyRate),
                                periodEarned,
                                mode: info.mode,
                                siteTotal: info.siteTotal,
                                sitePaid: info.sitePaid,
                                siteOwed: info.siteOwed
                            });
                        } else if (includeZeroHourFinished && s.isPaid && info.allTimeHours === 0 && info.siteTotal > 0) {
                            confirmedEarned += info.siteTotal;
                        }
                    });

                    const totalEarned = toMoney(confirmedEarned + inProgressEarned);
                    const maxEarned = Math.max(...siteBreakdown.map(x => x.periodEarned), 1);
                    siteBreakdown.forEach(item => {
                        item.sharePct = totalEarned > 0
                            ? Math.round((item.periodEarned / totalEarned) * 100)
                            : Math.round((item.periodHours / Math.max(totalHours, 1)) * 100);
                        item.barPct = item.periodEarned > 0
                            ? Math.max(6, Math.round((item.periodEarned / maxEarned) * 100))
                            : Math.max(6, Math.round((item.periodHours / Math.max(totalHours, 1)) * 100));
                    });

                    siteBreakdown.sort((a, b) => (b.periodEarned - a.periodEarned) || (b.periodHours - a.periodHours));

                    return {
                        confirmedEarned: toMoney(confirmedEarned),
                        inProgressEarned: toMoney(inProgressEarned),
                        totalEarned,
                        totalHours: toMoney(totalHours),
                        activeDays: activeDateSet.size,
                        avgRatePerHour: totalHours > 0 ? toMoney(totalEarned / totalHours) : 0,
                        laborCost: toMoney(laborCost),
                        netAfterCrew: toMoney(totalEarned - laborCost),
                        siteBreakdown
                    };
                };

                const statsSummary = computed(() => {
                    const curr = computePeriodStats(
                        (dateStr) => isDateInTimeframe(dateStr),
                        statTimeframe.value === 'All'
                    );

                    let prevPeriodDiffPct = null;
                    if (statTimeframe.value === 'Month' || statTimeframe.value === 'Week') {
                        const prev = computePeriodStats(
                            (dateStr) => isDateInOffsetPeriod(dateStr, statTimeframe.value, timeOffset.value - 1),
                            false
                        );
                        if (prev.totalEarned > 0) {
                            prevPeriodDiffPct = Math.round(((curr.totalEarned - prev.totalEarned) / prev.totalEarned) * 100);
                        }
                    }

                    const globalUnpaidTotal = toMoney(
                        activeSites.value.reduce((sum, s) => sum + calculateSiteOwed(s.id), 0)
                    );
                    const unpaidSitesCount = activeSites.value.filter(s => !s.isPaid && calculateSiteOwed(s.id) > 0).length;

                    return {
                        ...curr,
                        prevPeriodDiffPct,
                        globalUnpaidTotal,
                        unpaidSitesCount,
                        avgFinishedRate: toMoney(avgFinishedHourlyRate.value)
                    };
                });

                const statsSiteBreakdown = computed(() => statsSummary.value.siteBreakdown);

                const statsSixMonthHistory = computed(() => {
                    const now = new Date();
                    const list = [];
                    for (let i = 5; i >= 0; i--) {
                        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                        const monthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        const shortLabel = d.toLocaleDateString('ro-RO', { month: 'short' }).replace('.', '').toUpperCase();
                        const res = computePeriodStats((dateStr) => !!dateStr && dateStr.startsWith(monthStr), false);
                        list.push({
                            monthStr,
                            label: shortLabel,
                            totalEarned: res.totalEarned,
                            confirmedEarned: res.confirmedEarned,
                            hours: res.totalHours,
                            isSelected: statTimeframe.value === 'Month' && getSelectedMonthStr.value === monthStr
                        });
                    }
                    const maxVal = Math.max(...list.map(m => m.totalEarned), 1);
                    return list.map(m => ({
                        ...m,
                        barPct: m.totalEarned > 0 ? Math.max(10, Math.round((m.totalEarned / maxVal) * 100)) : 4
                    }));
                });

                const selectStatsMonth = (monthStr) => {
                    if (!monthStr) return;
                    statTimeframe.value = 'Month';
                    selectedMonth.value = monthStr;
                    const [year, month] = monthStr.split('-').map(Number);
                    const now = new Date();
                    timeOffset.value = (year - now.getFullYear()) * 12 + (month - 1 - now.getMonth());
                };

                const statsEmpList = computed(() => {
                    const map = {};
                    const periodLogs = logs.value.filter(l => isDateInTimeframe(l.date));
                    let totalHours = 0;

                    periodLogs.forEach(l => {
                        const h = parseFloat(l.h) || 0;
                        if (h <= 0) return;
                        totalHours += h;
                        const emp = employees.value.find(e => e.id === l.eid);
                        const logRate = getEmpRateForDate(emp, l.date);
                        const key = l.eid || 'unknown';
                        if (!map[key]) {
                            map[key] = {
                                eid: key,
                                name: emp?.name || 'Muncitor',
                                rate: logRate,
                                rates: new Set(),
                                hours: 0,
                                cost: 0,
                                dates: new Set()
                            };
                        }
                        map[key].hours += h;
                        map[key].cost += h * logRate;
                        map[key].rates.add(logRate);
                        if (l.date) map[key].dates.add(l.date.split('T')[0]);
                    });

                    const targetMonth = statTimeframe.value === 'Month' ? getSelectedMonthStr.value : '';

                    return Object.values(map)
                        .map(e => {
                            const st = targetMonth
                                ? settlements.value.find(s => s.eid === e.eid && s.month === targetMonth)
                                : null;
                            const sortedRates = Array.from(e.rates).sort((a, b) => a - b);
                            const rateLabel = sortedRates.length > 1
                                ? `${sortedRates[0]}→${sortedRates[sortedRates.length - 1]}`
                                : `${sortedRates[0] || 0}`;
                            return {
                                eid: e.eid,
                                name: e.name,
                                rate: sortedRates[sortedRates.length - 1] || 0,
                                rateLabel,
                                hours: toMoney(e.hours),
                                cost: toMoney(e.cost),
                                daysWorked: e.dates.size,
                                sharePct: totalHours > 0 ? Math.round((e.hours / totalHours) * 100) : 0,
                                settlementStatus: st ? (st.status || 'approved') : ''
                            };
                        })
                        .sort((a, b) => b.hours - a.hours);
                });

                const copyStatsWhatsApp = () => {
                    const s = statsSummary.value;
                    const periodTitle = statTimeframe.value === 'All' ? 'TOTAL GENERAL' : (currentTimeLabel.value || '').toUpperCase();
                    let msg = `📊 *RAPORT STATISTICI SP CREATIV*\n`;
                    msg += `🗓️ *Perioadă:* ${periodTitle}\n`;
                    msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
                    msg += `💶 *Produs estimat/confirmat:* €${s.totalEarned.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                    if (s.confirmedEarned > 0) msg += `  • 🟢 Finalizate: €${s.confirmedEarned.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                    if (s.inProgressEarned > 0) msg += `  • 🟡 În lucru: €${s.inProgressEarned.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                    msg += `⚡ *Medie / Oră:* €${s.avgRatePerHour.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}/h\n`;
                    msg += `⏱️ *Ore lucrate:* ${s.totalHours}h (${s.activeDays} zile active)\n`;
                    if (showCrewCost.value) {
                        msg += `👷 *Cost echipă:* €${s.laborCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                        msg += `💰 *Rămas după echipă:* €${s.netAfterCrew.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                    }
                    if (s.siteBreakdown.length > 0) {
                        msg += `\n🏗️ *Șantiere în perioadă:*\n`;
                        s.siteBreakdown.forEach(site => {
                            msg += ` • ${site.name}: ${site.periodHours}h × €${site.hourlyRate}/h = €${site.periodEarned.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
                        });
                    }
                    copyTextToClipboard(msg);
                };

                return { 
                    user, authForm, authLoading, authError, handleLogin, handleLogout, view, sites, employees, logs, form, news, priceForm, loading, toastMessage,
                    statTimeframe, timeOffset, currentTimeLabel, isAdmin, empEmails, empRates, selectedMonth, formatMonth,
                    activeSites, activeEmployees, archivedSites, archivedEmployees, showArchived, historyFilters, deletingLogId, deletingSiteId, permanentDeletingSiteId, deletingEmpId, permanentDeletingEmpId,
                    toggleEmp, saveLabor, deleteLog, addItemToSite, removeItemFromSite, togglePaid, addSite, addEmp, linkEmpEmail, unlinkEmpEmail, archiveSite, archiveEmp, restoreSite, restoreEmp, getSiteLogCount, canPermanentlyDeleteSite, permanentlyDeleteSite, getEmpLogCount, getEmpAllTimeHours, getEmpSettlementCount, canPermanentlyDeleteEmp, permanentlyDeleteEmp, updateEmpRate, updateItemPaymentPercent,
                    calculateSiteTotal, calculateSitePaid, calculateSiteOwed, getSiteHours, getSiteHoursPercentage, getTodayHours, getSelectedDateEmpHours,
                    getAllTimeSiteHours, calculateSiteYield,
                    mySiteHours, myTotalHours, mySortedLogs,
                    myCurrentTimeframeSettlement, myAllSettlements, myLatestSettlement,
                    getEmpName, getSiteName,
                    payrollStatus, getSelectedMonthStr, isSelectedMonthPaid, togglePayrollPaid, sortedSites,

                    // Modul Statistici Avansate (Pro-Rata €/h & Multi-Lună)
                    showCrewCost, avgFinishedHourlyRate, statsSummary, statsSiteBreakdown, statsSixMonthHistory, selectStatsMonth, statsEmpList, copyStatsWhatsApp,

                    // Mărire Tarif & Istoric Tarife Muncitori
                    getEmpRateForDate, raisingEmp, raisingEmpHistory, openEmpRaiseModal, closeEmpRaiseModal, setRaiseDatePreset, saveEmpRaise, deleteEmpRaiseEntry,

                    // Lucrări Rapide, Extra / Regie & Lipire din Factură
                    quickUnitOptions, setPriceFormMode, setPriceFormUnit, fillRegieSiteHours,
                    getSiteExtras, getSiteUnsentExtras, toggleExtraSent, markAllExtrasSent, copySiteExtrasForManager,
                    invoicePasteModal, openInvoicePasteModal, closeInvoicePasteModal, parseInvoiceText, addEmptyInvoiceRow, removeInvoiceRow, saveParsedInvoiceItems,

                    // Locație GPS & Navigație Waze / Google Maps
                    editingSiteLocation, workerSiteSearch, selectedSiteObject, filteredWorkerSites,
                    getSiteObject, hasSiteLocation, getSiteLocationSummary,
                    openInWaze, openInMaps, copySiteLocation, openEditSiteLocation, cancelEditSiteLocation,
                    detectCurrentGpsForSite, handleLocationQuickPaste, saveSiteLocation,

                    // Modul Flotă & Scadențe Documente
                    fleetDocs, fleetList, fleetUrgentItems, fleetUrgentCount, newFleet, deletingFleetId, fleetPresets,
                    formatFleetBannerAlert, getFleetStatusInfo, applyFleetPreset, addFleetItem, renewFleetItem, deleteFleetItem, copyFleetWhatsApp,
                    
                    // Modul Decont Returnat & Multiple Tranșe / Transferuri Bancare
                    settleSubTab, settleForm, deductionPresets, settleAutoHours, settleGross, settleTotalDeductions, settleNet,
                    addSettleDeduction, removeSettleDeduction, saveSettlementToCloud, deleteSettlement, copyWhatsAppSettlement,
                    copySpecificSettlement, onSettleEmpChange, settlements, sortedSettlements,
                    existingSettlementForSelection, loadExistingSettlement, updateSettlementStatus,
                    settleArchiveFilterEid, settleArchiveFilterStatus, settleArchiveFilterPaymentMethod, filteredSettlements,
                    addPayment, removePayment, totalPaidBank, totalPaidCash, totalPaidAll, remainingBalance,
                    fillRemainingAsTransfer, fillRemainingAsCash,
                    getItemPayments, getItemPaidTotal, getItemRemaining, formatPaymentBadge, formatPaymentDescription,

                    // Confirmare Finalizare Șantier
                    confirmingFinishSite, requestTogglePaid, confirmTogglePaid, cancelTogglePaid,

                    // Modificare / Editare Lucrări Șantier (Articole Deviz)
                    editingSiteItem, openEditSiteItem, cancelEditSiteItem, saveEditSiteItem,

                    // Editare Pontaj & Limitare Paginare
                    editingLog, openEditLog, cancelEditLog, saveEditLog, historyPageLimit,

                    // Calendar Vizual Pontaj
                    showVisualCalendar, calViewDate, calMonthName, prevCalMonth, nextCalMonth, setCalToday, selectCalDate,
                    calendarDays, loggedDatesMap, selectedDateLogSummary, selectedDayTotalHours,

                    visibleLogs: computed(() => {
                        return logs.value
                            .filter(l => {
                                const matchEmp = !historyFilters.eid || l.eid === historyFilters.eid;
                                const matchSite = !historyFilters.sid || l.sid === historyFilters.sid;
                                return matchEmp && matchSite;
                            })
                            .sort((a,b) => new Date(b.date) - new Date(a.date))
                            .slice(0, historyPageLimit.value);
                    }),

                    statsEmpHours: computed(() => {
                        const res = {};
                        logs.value.filter(l => isDateInTimeframe(l.date)).forEach(l => {
                            const emp = employees.value.find(e => e.id === l.eid);
                            const n = emp?.name || 'Muncitor';
                            if(!res[n]) res[n] = { hours: 0, rate: emp?.rate || 0 };
                            res[n].hours += (parseFloat(l.h) || 0);
                        });
                        return res;
                    }),

                    dailyBreakdown: computed(() => {
                        const days = {};
                        const siteInfoCache = {};
                        logs.value.filter(l => isDateInTimeframe(l.date)).forEach(l => {
                            const h = parseFloat(l.h) || 0;
                            if (!days[l.date]) days[l.date] = { hours: 0, earned: 0, workers: new Set() };
                            days[l.date].hours += h;
                            if (l.eid) days[l.date].workers.add(l.eid);
                            if (!siteInfoCache[l.sid]) {
                                const site = sites.value.find(s => s.id === l.sid);
                                siteInfoCache[l.sid] = getSiteHourlyInfo(site);
                            }
                            days[l.date].earned += h * (siteInfoCache[l.sid]?.hourlyRate || 0);
                        });
                        return Object.keys(days)
                            .sort((a,b) => new Date(b) - new Date(a)) 
                            .map(date => ({
                                date,
                                displayDate: formatDisplayDateSafe(date),
                                hours: toMoney(days[date].hours),
                                estimatedEarned: toMoney(days[date].earned),
                                workerCount: days[date].workers.size
                            }));
                    }),

                    weeklyTrack: computed(() => {
                        const days = getWeekDates();
                        const relevantLogs = logs.value.filter(l => {
                            if (!isAdmin.value && currentUserEmployee.value) {
                                return l.eid === currentUserEmployee.value.id;
                            }
                            return true;
                        });

                        return days.map(d => {
                            const dayLogs = relevantLogs.filter(l => l.date === d.dateStr);
                            const hrs = dayLogs.reduce((sum, l) => sum + (parseFloat(l.h) || 0), 0);
                            return {
                                ...d,
                                hours: hrs,
                                worked: hrs > 0
                            };
                        });
                    }),

                    weekdayDistribution: computed(() => {
                        const relevantLogs = logs.value.filter(l => {
                            if (!isDateInTimeframe(l.date)) return false;
                            if (!isAdmin.value && currentUserEmployee.value) {
                                return l.eid === currentUserEmployee.value.id;
                            }
                            return true;
                        });

                        const dayMap = ['Dum', 'Lun', 'Mar', 'Mie', 'Joi', 'Vin', 'Sâm'];
                        const counts = { 'Lun': 0, 'Mar': 0, 'Mie': 0, 'Joi': 0, 'Vin': 0, 'Sâm': 0, 'Dum': 0 };
                        
                        relevantLogs.forEach(l => {
                            const parts = l.date.split('-');
                            if (parts.length === 3) {
                                const date = new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0);
                                const dayName = dayMap[date.getDay()];
                                if (counts[dayName] !== undefined) {
                                    counts[dayName] += (parseFloat(l.h) || 0);
                                }
                            }
                        });

                        const maxHours = Math.max(...Object.values(counts), 1);

                        return Object.keys(counts).map(day => ({
                            day,
                            hours: counts[day],
                            percentage: Math.round((counts[day] / maxHours) * 100)
                        }));
                    }),
                    
                    statsRevenue: computed(() => {
                        let paid = 0, unpaid = 0, laborCost = 0;
                        
                        sites.value.forEach(s => {
                            const sitePaid = calculateSitePaid(s.id);
                            const siteOwed = calculateSiteOwed(s.id);
                            const hasLogs = logs.value.some(l => l.sid === s.id && isDateInTimeframe(l.date));
                            if(hasLogs || statTimeframe.value === 'All') {
                                paid += sitePaid;
                                unpaid += siteOwed;
                            }
                        });

                        logs.value.filter(l => isDateInTimeframe(l.date)).forEach(l => {
                            const emp = employees.value.find(e => e.id === l.eid);
                            laborCost += ((parseFloat(l.h) || 0) * getEmpRateForDate(emp, l.date));
                        });

                        return { 
                            paid: toMoney(paid), 
                            unpaid: toMoney(unpaid), 
                            laborCost: toMoney(laborCost), 
                            profit: toMoney((paid + unpaid) - laborCost) 
                        };
                    }),

                    filteredLogs: computed(() => {
                        return logs.value
                            .filter(l => {
                                const matchEmp = !historyFilters.eid || l.eid === historyFilters.eid;
                                const matchSite = !historyFilters.sid || l.sid === historyFilters.sid;
                                return matchEmp && matchSite;
                            })
                            .sort((a,b) => new Date(b.date) - new Date(a.date));
                    })
                };
            }
        }).mount('#app');
    </script>
