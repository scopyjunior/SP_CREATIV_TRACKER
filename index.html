<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SP CREATIV">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="theme-color" content="#030712">
    <title>SP CREATIV | Secure Cloud</title>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#030712',
                            900: '#0f172a',
                            800: '#1e293b',
                            750: '#1e293b90',
                            700: '#334155',
                            600: '#475569',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                        },
                        brand: {
                            indigo: '#6366f1',
                            violet: '#8b5cf6',
                            emerald: '#10b981',
                            rose: '#f43f5e',
                            amber: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none !important; }
        body { 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
            background-color: #030712;
        }
        .active-nav { 
            color: #8b5cf6; 
            text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar { 
            width: 5px; 
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #334155; 
            border-radius: 10px; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
            background: #475569; 
        }
        .safe-bottom { 
            padding-bottom: env(safe-area-inset-bottom, 24px); 
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .glass-input {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
        .glass-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="text-slate-100 font-sans select-none antialiased min-h-screen relative overflow-x-hidden">
    
    <!-- ambient background blobs -->
    <div class="fixed inset-0 bg-slate-950 -z-50 overflow-hidden">
        <div class="absolute top-[-10%] left-[-15%] w-[60%] h-[60%] rounded-full bg-brand-indigo/10 blur-[130px] pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-15%] w-[60%] h-[60%] rounded-full bg-brand-violet/10 blur-[130px] pointer-events-none"></div>
    </div>

    <div id="app" v-cloak class="flex flex-col min-h-screen">
        
        <!-- LOGIN SCREEN -->
        <div v-if="!user" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-12 -right-12 w-28 h-28 bg-brand-indigo/20 rounded-full blur-2xl"></div>
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 shadow-lg overflow-hidden border border-slate-700/50">
                        <img src="./icon-192.png" alt="SP CREATIV Logo" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo via-violet-400 to-brand-violet italic uppercase tracking-wider">SP CREATIV</h1>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Secure Cloud Portal</p>
                </div>
                <div class="space-y-4">
                    <div class="relative">
                        <input v-model="authForm.email" type="email" placeholder="Email" class="w-full glass-input p-4 pl-5 rounded-2xl font-semibold outline-none text-sm text-slate-100 transition-all">
                    </div>
                    <div class="relative">
                        <input v-model="authForm.pass" type="password" placeholder="Password" class="w-full glass-input p-4 pl-5 rounded-2xl font-semibold outline-none text-sm text-slate-100 transition-all">
                    </div>
                    <button @click="handleLogin" class="w-full bg-gradient-to-r from-brand-indigo to-brand-violet hover:from-brand-indigo/90 hover:to-brand-violet/90 text-white font-black py-4 rounded-2xl shadow-lg shadow-brand-indigo/20 active:scale-95 transition-all text-sm tracking-widest uppercase">
                        {{ authLoading ? 'VERIFYING...' : 'LOGIN' }}
                    </button>
                    <p v-if="authError" class="text-brand-rose text-[10px] font-bold text-center uppercase mt-2 tracking-wide">{{ authError }}</p>
                </div>
            </div>
        </div>

        <!-- APP CONTENT -->
        <template v-if="user">
            <!-- Header -->
            <header class="bg-slate-900/40 backdrop-blur-md border-b border-slate-800/60 px-6 py-4 pt-10 sticky top-0 z-30 flex justify-between items-center shadow-md">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl overflow-hidden border border-slate-750 flex items-center justify-center shadow-md">
                        <img src="./icon-192.png" alt="SP CREATIV Logo" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 class="text-md font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo to-brand-violet italic uppercase leading-none">SP CREATIV</h1>
                        <p class="text-[8px] font-extrabold uppercase mt-1 tracking-wider" :class="isAdmin ? 'text-brand-indigo' : 'text-brand-emerald'">
                            {{ isAdmin ? 'Administrator' : 'Crew Mode' }} • {{ (user.email || '').split('@')[0] }}
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div v-if="loading" class="animate-spin h-3.5 w-3.5 border-2 border-brand-indigo border-t-transparent rounded-full"></div>
                    <button @click="handleLogout" class="text-[9px] font-black bg-slate-800/80 hover:bg-slate-755 border border-slate-700/50 px-3.5 py-1.5 rounded-full uppercase active:scale-90 transition-all tracking-wider text-slate-300">Logout</button>
                </div>
            </header>

            <main class="flex-1 p-4 pb-32 max-w-lg mx-auto w-full">
                
                <!-- LOADING SKELETON -->
                <div v-if="loading && sites.length === 0" class="space-y-4 animate-pulse">
                    <div class="glass-panel h-48 rounded-[2.5rem] p-6 space-y-4">
                        <div class="h-4 bg-slate-800 rounded-md w-1/3"></div>
                        <div class="h-12 bg-slate-800 rounded-xl"></div>
                        <div class="h-12 bg-slate-800 rounded-xl"></div>
                    </div>
                    <div class="glass-panel h-64 rounded-[2.5rem] p-6 space-y-4">
                        <div class="h-4 bg-slate-800 rounded-md w-1/2"></div>
                        <div class="h-8 bg-slate-800 rounded-lg" v-for="i in 3" :key="i"></div>
                    </div>
                </div>

                <template v-else>
                    <!-- ========================================== -->
                    <!--               ADMIN VIEWS                  -->
                    <!-- ========================================== -->
                    <template v-if="isAdmin">
                        
                        <!-- ADMIN VIEW: LOG LABOR -->
                        <div v-if="view === 'log'" class="space-y-4">
                            <div class="glass-panel p-6 rounded-[2.5rem] shadow-xl relative overflow-hidden">
                                <div class="absolute -top-10 -left-10 w-24 h-24 bg-brand-indigo/5 rounded-full blur-2xl pointer-events-none"></div>
                                <h3 class="text-xs font-black uppercase text-slate-400 mb-5 tracking-widest">Log Labor</h3>
                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    <div class="space-y-1.5">
                                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Date</label>
                                        <input type="date" v-model="form.date" class="w-full glass-input rounded-2xl p-4 border-0 text-xs font-bold outline-none text-white transition-all">
                                    </div>
                                    <div class="space-y-1.5">
                                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Hours to Add</label>
                                        <input type="number" step="0.5" min="0" v-model="form.hours" class="w-full glass-input rounded-2xl p-4 border-0 text-xs font-bold outline-none text-white transition-all">
                                    </div>
                                </div>
                                
                                <div class="space-y-1.5 mb-5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Project Site</label>
                                    <div class="relative">
                                        <select v-model="form.siteId" class="w-full glass-input rounded-2xl p-4 border-0 font-bold text-xs outline-none appearance-none text-white transition-all">
                                            <option value="" disabled class="bg-slate-900 text-slate-400">Select Site...</option>
                                            <option v-for="s in sortedSites" :key="s.id" :value="s.id" class="bg-slate-900 text-slate-100">{{s.name}}</option>
                                        </select>
                                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-2">
                                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Select Crew</label>
                                    <div class="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                                        <button v-for="e in employees" :key="e.id" @click="toggleEmp(e.id)" 
                                             :class="form.selected.includes(e.id) ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow-lg shadow-brand-indigo/10 border-transparent' : 'bg-slate-900/30 text-slate-400 border-slate-800/80'"
                                             class="p-4 rounded-2xl font-bold text-left flex justify-between items-center transition-all border hover:border-slate-700/80">
                                            <div class="flex flex-col">
                                                <span class="text-xs" :class="form.selected.includes(e.id) ? 'text-white' : 'text-slate-200'">{{e.name}}</span>
                                                <span class="text-[8px] uppercase tracking-wide mt-0.5" :class="form.selected.includes(e.id) ? 'text-indigo-200' : 'text-slate-400'">
                                                    Daily total: {{ getTodayHours(e.id) }}h
                                                </span>
                                            </div>
                                            <span v-if="form.selected.includes(e.id)" class="bg-white/20 w-5 h-5 rounded-full flex items-center justify-center text-xs">✓</span>
                                        </button>
                                    </div>
                                </div>

                                <button @click="saveLabor" :disabled="!form.siteId || !form.selected.length || loading"
                                        class="w-full bg-gradient-to-r from-brand-indigo to-brand-violet disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 text-white font-black py-4.5 rounded-2xl mt-8 shadow-xl shadow-brand-indigo/10 active:scale-95 transition-all text-xs tracking-wider">
                                    {{ loading ? 'SYNCING...' : 'SYNC ENTRIES (' + form.selected.length + ')' }}
                                </button>
                            </div>
                        </div>

                        <!-- ADMIN VIEW: JOBS (Revenue) -->
                        <div v-if="view === 'jobs'" class="space-y-6">
                            <div v-for="site in sortedSites" :key="site.id" class="glass-panel rounded-[2.5rem] border border-slate-800/80 overflow-hidden shadow-xl">
                                <div class="p-5 flex justify-between items-center bg-slate-900/60 border-b border-slate-800/60">
                                    <div class="flex flex-col gap-0.5">
                                        <span class="font-black uppercase text-xs tracking-wider text-slate-200">{{ site.name }}</span>
                                    </div>
                                    <span class="text-md font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-indigo to-brand-violet">€{{ calculateSiteTotal(site.id).toLocaleString() }}</span>
                                </div>
                                <div class="p-5 space-y-4">
                                    <button @click="togglePaid(site.id)" :class="site.isPaid ? 'bg-brand-emerald/10 text-brand-emerald border-brand-emerald/20' : 'bg-brand-amber/10 text-brand-amber border-brand-amber/20'" class="w-full py-2.5 rounded-xl border font-black text-[9px] uppercase tracking-widest transition-all">
                                        {{ site.isPaid ? '🟢 PAID' : '🔴 UNPAID' }}
                                    </button>

                                    <!-- Site Yield Snapshot -->
                                    <div class="bg-slate-950/40 border border-slate-900/60 p-3 rounded-2xl flex justify-between items-center text-center">
                                        <div class="flex-1 border-r border-slate-800/40">
                                            <p class="text-[8px] font-black text-slate-500 uppercase tracking-wide">Total Hours</p>
                                            <p class="text-xs font-black text-slate-200">{{ getAllTimeSiteHours(site.id) }}h</p>
                                        </div>
                                        <div class="flex-1">
                                            <p class="text-[8px] font-black text-slate-500 uppercase tracking-wide">Hourly Yield</p>
                                            <p class="text-xs font-black text-brand-indigo">€{{ calculateSiteYield(site.id) }}/hr</p>
                                        </div>
                                    </div>
                                    
                                    <!-- Revenue Items list -->
                                    <div class="space-y-2">
                                        <div v-for="item in (site.pricingItems || [])" :key="item.id" class="flex justify-between items-center border-b border-slate-800/40 pb-2.5">
                                            <div class="flex flex-col">
                                                <span class="text-xs font-bold text-slate-200">{{item.desc}}</span>
                                                <span class="text-[8px] text-slate-500 font-extrabold uppercase mt-0.5">{{item.qty}}{{item.unit}} x €{{item.price}}</span>
                                            </div>
                                            <div class="flex items-center gap-3">
                                                <span class="text-xs font-black text-slate-300">€{{(item.qty * item.price).toLocaleString()}}</span>
                                                <button @click="removeItemFromSite(site.id, item.id)" class="text-brand-rose/40 hover:text-brand-rose transition-colors p-1 text-xs">✕</button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Add pricing item form -->
                                    <div class="bg-slate-900/30 border border-slate-800/40 p-4 rounded-3xl space-y-2">
                                        <input v-model="priceForm[site.id].desc" placeholder="Work description (e.g. Living Room)" class="w-full glass-input p-3 rounded-xl text-xs font-bold outline-none text-white">
                                        <div class="grid grid-cols-3 gap-2">
                                            <input v-model.number="priceForm[site.id].qty" type="number" placeholder="Qty" class="glass-input p-3 rounded-xl text-xs font-bold outline-none text-white">
                                            <input v-model="priceForm[site.id].unit" placeholder="m2" class="glass-input p-3 rounded-xl text-xs font-bold outline-none text-white uppercase text-center">
                                            <input v-model.number="priceForm[site.id].price" type="number" placeholder="Price" class="glass-input p-3 rounded-xl text-xs font-bold outline-none text-white">
                                        </div>
                                        <button @click="addItemToSite(site.id)" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-black py-3 rounded-xl text-[9px] uppercase tracking-wider transition-colors mt-1">Add Revenue Item</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ADMIN VIEW: STATS -->
                        <div v-if="view === 'stats'" class="space-y-4">
                            <!-- Timeframe switches -->
                            <div class="flex p-1 bg-slate-900/80 border border-slate-800/80 rounded-2xl sticky top-24 z-10 shadow-lg items-center">
                                <button @click="statTimeframe = 'Week'; timeOffset = 0" :class="statTimeframe === 'Week' ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow' : 'text-slate-400'" class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">Week</button>
                                <button @click="statTimeframe = 'Month'; timeOffset = 0" :class="statTimeframe === 'Month' ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow' : 'text-slate-400'" class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">Month</button>
                                <button @click="statTimeframe = 'All'" :class="statTimeframe === 'All' ? 'bg-gradient-to-r from-brand-indigo to-brand-violet text-white shadow' : 'text-slate-400'" class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">All</button>
                            </div>

                            <div v-if="statTimeframe !== 'All'" class="flex justify-between items-center bg-slate-900/40 border border-slate-800/40 p-2 rounded-2xl shadow-sm">
                                <button @click="timeOffset--" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-bold active:scale-95 transition-transform text-[9px] uppercase tracking-wider rounded-xl">← Prev</button>
                                <span class="text-[9px] font-black text-brand-indigo uppercase tracking-widest text-center flex-1">{{ currentTimeLabel }}</span>
                                <button @click="timeOffset++" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-bold active:scale-95 transition-transform text-[9px] uppercase tracking-wider rounded-xl" :class="{'opacity-30': timeOffset === 0}" :disabled="timeOffset === 0">Next →</button>
                            </div>

                            <!-- Payroll Status Toggle (Only in Month view) -->
                            <div v-if="statTimeframe === 'Month'" class="mb-4">
                                <button @click="togglePayrollPaid(getSelectedMonthStr)" 
                                        :class="isSelectedMonthPaid ? 'bg-brand-emerald/10 border-brand-emerald/20 text-brand-emerald' : 'bg-brand-rose/10 border-brand-rose/20 text-brand-rose'" 
                                        class="w-full py-3.5 rounded-2xl border font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-transform">
                                    <span v-if="isSelectedMonthPaid">🟢 Crew Payroll: Paid</span>
                                    <span v-else>🔴 Crew Payroll: Unpaid</span>
                                </button>
                            </div>

                            <!-- Revenue Status Card -->
                            <div class="glass-panel p-6 rounded-[2.5rem] shadow-xl text-center relative overflow-hidden">
                                <div class="absolute -top-12 -right-12 w-28 h-28 bg-brand-indigo/10 rounded-full blur-2xl"></div>
                                <h3 class="text-[9px] font-black text-slate-400 uppercase mb-4 tracking-widest">Revenue Status</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <p class="text-[8px] font-black text-brand-emerald uppercase tracking-wide">Paid</p>
                                        <p class="text-xl font-black text-brand-emerald">€{{ statsRevenue.paid.toLocaleString() }}</p>
                                    </div>
                                    <div>
                                        <p class="text-[8px] font-black text-brand-amber uppercase tracking-wide">Owed</p>
                                        <p class="text-xl font-black text-brand-amber">€{{ statsRevenue.unpaid.toLocaleString() }}</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Total Hours per Site -->
                            <div class="glass-panel p-6 rounded-[2.5rem] shadow-xl">
                                <h3 class="text-[9px] font-black text-slate-400 uppercase mb-4 tracking-widest">Total Hours per Site</h3>
                                <div v-for="site in sites" :key="site.id" class="py-3 border-b border-slate-800/40 last:border-0 flex flex-col gap-1.5">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-xs text-slate-200">{{ site.name }}</span>
                                        <span class="text-brand-indigo font-black text-[9px] bg-brand-indigo/10 px-2.5 py-1 rounded-full">{{ getSiteHours(site.id) }}h</span>
                                    </div>
                                    <!-- Progress indicator bar -->
                                    <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                                        <div class="bg-gradient-to-r from-brand-indigo to-brand-violet h-1.5 rounded-full" :style="{ width: getSiteHoursPercentage(site.id) + '%' }"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Crew Payroll/Hours (Period) -->
                            <div class="glass-panel p-6 rounded-[2.5rem] shadow-xl">
                                <h3 class="text-[9px] font-black text-slate-400 uppercase mb-4 tracking-widest">Crew Payroll (Period)</h3>
                                <div v-for="(h, name) in statsEmpHours" :key="name" class="py-3 border-b border-slate-800/40 last:border-0 flex justify-between items-center">
                                    <span class="font-bold text-xs text-slate-200">{{ name }}</span>
                                    <span class="text-brand-indigo font-black text-xs bg-brand-indigo/10 px-2.5 py-1 rounded-full">{{ h }}h</span>
                                </div>
                                <div v-if="Object.keys(statsEmpHours).length === 0" class="text-center py-6 text-slate-500 text-xs font-semibold">
                                    No logged crew hours for this period.
                                </div>
                            </div>
                        </div>

                        <!-- ADMIN VIEW: HISTORY -->
                        <div v-if="view === 'history'" class="space-y-3">
                            <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest px-2 mb-2">Logs Archive</h3>
                            <div v-for="log in sortedLogs" :key="log.id" class="glass-panel p-4 rounded-2xl shadow-sm flex justify-between items-center">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="text-[8px] font-black text-brand-indigo bg-brand-indigo/10 px-2.5 py-0.5 rounded uppercase tracking-wider">{{ log.date }}</span>
                                        <span class="text-[8px] font-black text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded uppercase tracking-wider">{{ log.h }} HRS</span>
                                    </div>
                                    <p class="font-bold text-slate-200 text-xs mt-1.5">{{ getEmpName(log.eid) }}</p>
                                    <p class="text-[9px] text-slate-500 font-extrabold uppercase tracking-wide">{{ getSiteName(log.sid) }}</p>
                                </div>
                                <button @click="deleteLog(log.id)" class="text-brand-rose/40 hover:text-brand-rose p-2 active:scale-75 transition-all text-xs">✕</button>
                            </div>
                            <div v-if="sortedLogs.length === 0" class="text-center py-12 text-slate-500">
                                No logs found.
                            </div>
                        </div>

                        <!-- ADMIN VIEW: SETUP & SYSTEM -->
                        <div v-if="view === 'setup'" class="space-y-6">
                            <div class="space-y-3 px-1">
                                <h2 class="font-black text-md uppercase tracking-wider text-slate-200">System Management</h2>
                                
                                <div class="glass-panel p-5 rounded-3xl space-y-4">

    <!-- Firebase Libraries -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        // Correct imports for Firestore
        import { 
            getFirestore as initFirestore, 
            collection as fsCollection, 
            doc as fsDoc, 
            addDoc as fsAddDoc, 
            setDoc as fsSetDoc,
            updateDoc as fsUpdateDoc, 
            deleteDoc as fsDeleteDoc, 
            onSnapshot as fsOnSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { createApp, ref, reactive, computed, onMounted, watch } = Vue;

        const firebaseConfig = {
            apiKey: "AIzaSyA9ErQCRNaHA6eXr4qmm0tfDrf3WfoJnhY",
            authDomain: "sp-creativ-tracker.firebaseapp.com",
            projectId: "sp-creativ-tracker",
            storageBucket: "sp-creativ-tracker.firebasestorage.app",
            messagingSenderId: "2932232690",
            appId: "1:2932232690:web:acb6842bfcb49d427adb6b"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = initFirestore(fbApp);
        const appId = 'sp-creativ-final';

        createApp({
            setup() {
                const user = ref(null);
                const authLoading = ref(false);
                const authError = ref('');
                const authForm = reactive({ email: '', pass: '' });
                const view = ref('log');
                const loading = ref(true);

                const sites = ref([]);
                const employees = ref([]);
                const logs = ref([]);
                
                // Form models
                const form = ref({ 
                    date: new Date().toISOString().split('T')[0], 
                    hours: 8, 
                    siteId: '', 
                    selected: [] 
                });

                const news = ref({ site: '', emp: '', empEmail: '' });
                const empEmails = reactive({});
                const priceForm = reactive({});
                const payrollStatus = ref([]);

                // Time Filter Logic
                const statTimeframe = ref('Month');
                const timeOffset = ref(0);
                const d = new Date();
                const selectedMonth = ref(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);

                const formatMonth = (val) => {
                    if(!val) return 'MONTH';
                    const [year, month] = val.split('-');
                    const date = new Date(year, month - 1);
                    return date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }).toUpperCase();
                };

                onMounted(async () => {
                    onAuthStateChanged(auth, (u) => {
                        user.value = u;
                        if(u) startSync();
                        else {
                            loading.value = false;
                        }
                    });
                });

                const startSync = () => {
                    fsOnSnapshot(fsCollection(db, 'artifacts', appId, 'public', 'data', 'sites'), (snap) => {
                        sites.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        sites.value.forEach(s => { 
                            if(!priceForm[s.id]) {
                                priceForm[s.id] = { desc: '', qty: 0, unit: 'm2', price: 0 }; 
                            }
                        });
                        loading.value = false;
                    });

                    fsOnSnapshot(fsCollection(db, 'artifacts', appId, 'public', 'data', 'employees'), (snap) => {
                        employees.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        employees.value.forEach(e => {
                            if (e.email) empEmails[e.id] = e.email;
                        });
                    });

                    fsOnSnapshot(fsCollection(db, 'artifacts', appId, 'public', 'data', 'logs'), (snap) => {
                        logs.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });

                    fsOnSnapshot(fsCollection(db, 'artifacts', appId, 'public', 'data', 'payroll_status'), (snap) => {
                        payrollStatus.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });
                };

                const handleLogin = async () => {
                    authLoading.value = true;
                    authError.value = '';
                    try { 
                        await signInWithEmailAndPassword(auth, authForm.email, authForm.pass); 
                    } catch (e) { 
                        authError.value = 'Invalid Login Credentials'; 
                    } finally { 
                        authLoading.value = false; 
                    }
                };

                const handleLogout = () => signOut(auth);

                // --- ROLE LOGIC ---
                const currentUserEmployee = computed(() => {
                    if (!user.value || !user.value.email) return null;
                    return employees.value.find(e => e.email && e.email.toLowerCase() === user.value.email.toLowerCase());
                });

                const isAdmin = computed(() => !currentUserEmployee.value);

                watch(isAdmin, (adminStatus) => {
                    if (adminStatus) {
                        view.value = 'log';
                    } else {
                        view.value = 'my_stats';
                    }
                });

                const toggleEmp = (id) => {
                    const i = form.value.selected.indexOf(id);
                    if (i > -1) form.value.selected.splice(i, 1); else form.value.selected.push(id);
                };

                // Get daily logged hours
                const getTodayHours = (eid) => {
                    return logs.value
                        .filter(l => l.eid === eid && l.date === form.value.date)
                        .reduce((sum, log) => sum + parseFloat(log.h || 0), 0);
                };

                const saveLabor = async () => {
                    if (!user.value || !isAdmin.value) return;
                    loading.value = true;
                    const col = fsCollection(db, 'artifacts', appId, 'public', 'data', 'logs');
                    
                    try {
                        for(const eid of form.value.selected) {
                            await fsAddDoc(col, { 
                                eid, 
                                sid: form.value.siteId, 
                                date: form.value.date, 
                                h: parseFloat(form.value.hours)
                            });
                        }
                        form.value.selected = [];
                    } catch (e) { 
                        console.error(e); 
                    } finally { 
                        loading.value = false; 
                    }
                };

                const deleteLog = async (id) => { 
                    if (!user.value || !isAdmin.value) return;
                    if(confirm('Permanently delete this labor entry?')) {
                        await fsDeleteDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'logs', id));
                    }
                };

                const calculateSiteTotal = (sid) => (sites.value.find(x => x.id === sid)?.pricingItems || []).reduce((a, b) => a + (b.qty * b.price), 0);

                const getAllTimeSiteHours = (sid) => logs.value.filter(l => l.sid === sid).reduce((a, b) => a + b.h, 0);

                const calculateSiteYield = (sid) => {
                    const rev = calculateSiteTotal(sid);
                    const hrs = getAllTimeSiteHours(sid);
                    return hrs > 0 ? Math.round(rev / hrs) : 0;
                };

                const addItemToSite = async (sid) => {
                    if (!user.value || !isAdmin.value) return;
                    const s = sites.value.find(x => x.id === sid);
                    const items = [...(s.pricingItems || []), { id: Date.now(), ...priceForm[sid] }];
                    await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', sid), { pricingItems: items });
                    priceForm[sid].desc = ''; priceForm[sid].qty = 0;
                };

                const removeItemFromSite = async (sid, iid) => {
                    if (!user.value || !isAdmin.value) return;
                    const s = sites.value.find(x => x.id === sid);
                    const items = s.pricingItems.filter(i => i.id !== iid);
                    await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', sid), { pricingItems: items });
                };

                const togglePaid = async (sid) => {
                    if (!user.value || !isAdmin.value) return;
                    const s = sites.value.find(x => x.id === sid);
                    await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', sid), { isPaid: !s.isPaid });
                };

                const addSite = async () => { 
                    if (!user.value || !isAdmin.value || !news.value.site) return; 
                    await fsAddDoc(fsCollection(db, 'artifacts', appId, 'public', 'data', 'sites'), { 
                        name: news.value.site, 
                        isPaid: false, 
                        pricingItems: [],
                        createdAt: Date.now()
                    }); 
                    news.value.site = ''; 
                };

                const addEmp = async () => { 
                    if (!user.value || !isAdmin.value || !news.value.emp) return; 
                    await fsAddDoc(fsCollection(db, 'artifacts', appId, 'public', 'data', 'employees'), { 
                        name: news.value.emp,
                        email: news.value.empEmail ? news.value.empEmail.trim() : ''
                    }); 
                    news.value.emp = ''; 
                    news.value.empEmail = '';
                };

                const linkEmpEmail = async (id) => {
                    if (!user.value || !isAdmin.value || !empEmails[id]) return;
                    await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'employees', id), { 
                        email: empEmails[id].trim() 
                    });
                };

                const unlinkEmpEmail = async (id) => {
                    if (!user.value || !isAdmin.value) return;
                    await fsUpdateDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'employees', id), { 
                        email: '' 
                    });
                };

                const removeSite = async (id) => { if(confirm('Delete site and all related data?')) await fsDeleteDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'sites', id)); };
                const removeEmp = async (id) => { if(confirm('Remove worker from roster?')) await fsDeleteDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'employees', id)); };

                const isDateInTimeframe = (dateStr) => {
                    if (statTimeframe.value === 'All') return true;
                    
                    const logD = new Date(dateStr); 
                    const now = new Date();
                    
                    if (statTimeframe.value === 'Month') {
                        const targetMonth = new Date(now.getFullYear(), now.getMonth() + timeOffset.value, 1);
                        return logD.getFullYear() === targetMonth.getFullYear() && logD.getMonth() === targetMonth.getMonth();
                    }
                    
                    if (statTimeframe.value === 'Week') {
                        const day = now.getDay();
                        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                        const currentMonday = new Date(now.setDate(diff));
                        currentMonday.setHours(0,0,0,0);
                        
                        const targetMonday = new Date(currentMonday);
                        targetMonday.setDate(targetMonday.getDate() + (timeOffset.value * 7));
                        
                        const targetSunday = new Date(targetMonday);
                        targetSunday.setDate(targetSunday.getDate() + 6);
                        targetSunday.setHours(23,59,59,999);
                        
                        return logD >= targetMonday && logD <= targetSunday;
                    }
                    return true;
                };

                // site hours
                const getSiteHours = (sid) => logs.value.filter(l => l.sid === sid && isDateInTimeframe(l.date)).reduce((a, b) => a + b.h, 0);

                // Max site hours in period for UI percentage calculations
                const getMaxSiteHours = () => {
                    const hours = sites.value.map(s => getSiteHours(s.id));
                    const max = Math.max(...hours);
                    return max > 0 ? max : 1;
                };

                const getSiteHoursPercentage = (sid) => {
                    const h = getSiteHours(sid);
                    return Math.round((h / getMaxSiteHours()) * 100);
                };

                const getEmpName = (id) => employees.value.find(e => e.id === id)?.name || '...';
                const getSiteName = (id) => sites.value.find(s => s.id === id)?.name || '...';

                const currentTimeLabel = computed(() => {
                    if (statTimeframe.value === 'Month') {
                        const d = new Date();
                        d.setMonth(d.getMonth() + timeOffset.value);
                        return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                    }
                    if (statTimeframe.value === 'Week') {
                        if (timeOffset.value === 0) return 'This Week';
                        if (timeOffset.value === -1) return 'Last Week';
                        
                        const now = new Date();
                        const day = now.getDay();
                        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                        const targetMonday = new Date(now.setDate(diff));
                        targetMonday.setDate(targetMonday.getDate() + (timeOffset.value * 7));
                        
                        const targetSunday = new Date(targetMonday);
                        targetSunday.setDate(targetSunday.getDate() + 6);
                        
                        const format = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        return `${format(targetMonday)} - ${format(targetSunday)}`;
                    }
                    return '';
                });

                // WORKER SPECIFIC COMPUTEDS
                const mySiteHours = computed(() => {
                    if (isAdmin.value || !currentUserEmployee.value) return [];
                    const myEid = currentUserEmployee.value.id;
                    const myLogs = logs.value.filter(l => l.eid === myEid && isDateInTimeframe(l.date));
                    
                    const siteMap = {};
                    myLogs.forEach(l => { siteMap[l.sid] = (siteMap[l.sid] || 0) + l.h; });
                    
                    return Object.keys(siteMap).map(sid => ({
                        siteName: sites.value.find(s => s.id === sid)?.name || 'Unknown Site',
                        hours: siteMap[sid]
                    }));
                });

                const myTotalHours = computed(() => mySiteHours.value.reduce((sum, s) => sum + s.hours, 0));

                const getWorkerSiteHoursPercentage = (hours) => {
                    const total = myTotalHours.value;
                    return total > 0 ? Math.round((hours / total) * 100) : 0;
                };

                const mySortedLogs = computed(() => {
                    if (isAdmin.value || !currentUserEmployee.value) return [];
                    return logs.value
                        .filter(l => l.eid === currentUserEmployee.value.id)
                        .sort((a,b) => new Date(b.date) - new Date(a.date));
                });

                const getSelectedMonthStr = computed(() => {
                    const now = new Date();
                    now.setMonth(now.getMonth() + timeOffset.value);
                    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                });

                const isSelectedMonthPaid = computed(() => {
                    const monthStr = getSelectedMonthStr.value;
                    const record = payrollStatus.value.find(p => p.id === monthStr);
                    return record ? record.isPaid : false;
                });

                const togglePayrollPaid = async (monthStr) => {
                    if (!user.value || !isAdmin.value) return;
                    const existing = payrollStatus.value.find(p => p.id === monthStr);
                    const isPaid = existing ? !existing.isPaid : true;
                    await fsSetDoc(fsDoc(db, 'artifacts', appId, 'public', 'data', 'payroll_status', monthStr), { isPaid });
                };

                const getLast6Months = computed(() => {
                    const list = [];
                    const now = new Date();
                    for (let i = 0; i < 6; i++) {
                        const temp = new Date(now.getFullYear(), now.getMonth() - i, 1);
                        const monthStr = `${temp.getFullYear()}-${String(temp.getMonth() + 1).padStart(2, '0')}`;
                        const label = temp.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                        list.push({ monthStr, label });
                    }
                    return list;
                });
                const sortedSites = computed(() => {
                    return [...sites.value].sort((a, b) => {
                        const logsA = logs.value.filter(l => l.sid === a.id);
                        const maxTA = logsA.length > 0 ? Math.max(...logsA.map(l => {
                            const d = new Date(l.date).getTime();
                            return isNaN(d) ? 0 : d;
                        })) : 0;
                        const tA = maxTA || (a.createdAt !== undefined ? a.createdAt : 0);

                        const logsB = logs.value.filter(l => l.sid === b.id);
                        const maxTB = logsB.length > 0 ? Math.max(...logsB.map(l => {
                            const d = new Date(l.date).getTime();
                            return isNaN(d) ? 0 : d;
                        })) : 0;
                        const tB = maxTB || (b.createdAt !== undefined ? b.createdAt : 0);

                        return tB - tA;
                    });
                });
                return { 
                    user, authForm, authLoading, authError, handleLogin, handleLogout, view, sites, employees, logs, form, news, priceForm, loading, 
                    statTimeframe, timeOffset, currentTimeLabel, isAdmin, empEmails, selectedMonth, formatMonth,
                    toggleEmp, saveLabor, deleteLog, addItemToSite, removeItemFromSite, togglePaid, addSite, addEmp, removeSite, removeEmp, linkEmpEmail, unlinkEmpEmail,
                    calculateSiteTotal, getSiteHours, getSiteHoursPercentage, getTodayHours,
                    getAllTimeSiteHours, calculateSiteYield,
                    mySiteHours, myTotalHours, mySortedLogs, getWorkerSiteHoursPercentage,
                    getEmpName, getSiteName,
                    payrollStatus, getSelectedMonthStr, isSelectedMonthPaid, togglePayrollPaid, getLast6Months, sortedSites,
                    statsEmpHours: computed(() => {
                        const res = {};
                        logs.value.filter(l => isDateInTimeframe(l.date)).forEach(l => {
                            const n = employees.value.find(e => e.id === l.eid)?.name || 'Worker';
                            res[n] = (res[n] || 0) + l.h;
                        });
                        return res;
                    }),
                    statsRevenue: computed(() => {
                        const res = { paid: 0, unpaid: 0 };
                        sites.value.forEach(s => {
                            const hasLogs = logs.value.some(l => l.sid === s.id && isDateInTimeframe(l.date));
                            if(hasLogs || statTimeframe.value === 'All') {
                                if(s.isPaid) res.paid += calculateSiteTotal(s.id); else res.unpaid += calculateSiteTotal(s.id);
                            }
                        });
                        return res;
                    }),
                    sortedLogs: computed(() => [...logs.value].sort((a,b) => new Date(b.date) - new Date(a.date)))
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
